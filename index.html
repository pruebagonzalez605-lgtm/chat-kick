<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Chat en tiempo real — Kick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-panel: #111111;
      --text: #e5e7eb;
      --muted: #888;
      --font: "Baloo Tammudu 2", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 100vh;
      font-weight: 800;
    }

    #chat-section {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #channel-input-container {
      padding: 1rem;
      width: 100%;
      background: var(--bg-dark);
    }

    #chat {
      height: auto;
      overflow-y: auto;
      padding: 1rem;
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
      background: transparent;
      flex-grow: 1;
      font-size: 20px;
      display: flex;
      flex-direction: column;
    }

    #chat::-webkit-scrollbar { width: 0px; }

    .msg {
      margin-bottom: 0.3rem;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(2px 2px 0.2rem black);
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateY(5px);
      animation: fadeUp 0.3s ease forwards;
      line-height: 36px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      word-wrap: break-word;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 0;
      flex-wrap: nowrap;
    }

    .badge-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 3px;
      margin-bottom: 2px;
      display: inline-block;
    }

    .user {
      font-weight: 800;
      font-size: 1em;
      display: inline;
      align-items: center;
      gap: 2px;
    }

    .username-text {
      display: inline-block;
      position: relative;
      line-height: inherit;
      vertical-align: baseline;
      background-size: 100%;
      background-repeat: no-repeat;
    }

    .username-text[data-7tv-overlay="true"]::after {
      content: attr(data-username);
      position: absolute;
      inset: 0;
      color: transparent;
      background-image: var(--seventv-paint-bg);
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: var(--seventv-paint-opacity, 1.0);
      text-shadow: none;
      filter: none;
      pointer-events: none;
    }
    
    .user::after {
      content: ': ';
    }

    .text {
      color: var(--text);
      line-height: 1.4;
      word-wrap: break-word;
      word-break: break-word;
      font-size: 1em;
      background: transparent;
      display: inline;
      margin-left: 5px;
      flex: 1 1 0;
      min-width: 0;
    }

    /* ===================== EMOTES ===================== */
    .emote {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-third {
      height: 32px;
      width: auto;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-zero-width {
      position: absolute;
      margin-left: -32px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <section id="chat-section">
    <div id="channel-input-container">
      <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
        <input type="text" id="channel-name-input" placeholder="Nombre del canal (ej: elshark)" 
               style="flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: none; background: #222; color: #fff; font-size: 16px; font-family: var(--font);">
        <button id="load-chat-btn" 
                style="padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font);">
          Cargar Chat
        </button>
      </div>
      <div id="status-message" style="color: var(--muted); font-size: 14px; margin-bottom: 0.5rem;"></div>
      <div id="link-container" style="margin-top: 0.5rem; padding: 0.75rem; background: #1a1a1a; border-radius: 8px; display: none;">
        <label style="color: #53fc18; font-size: 14px; display: block; margin-bottom: 0.5rem; font-weight: 700;">🔗 Link para compartir:</label>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" id="generated-link" readonly
                 style="flex: 1; padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #0a0a0a; color: #53fc18; font-size: 13px; font-family: monospace;">
          <button id="copy-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 14px; cursor: pointer;">
            📋 Copiar
          </button>
          <button id="open-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 14px; font-weight: 700; cursor: pointer;">
            🚀 Abrir
          </button>
        </div>
      </div>
    </div>
    <div id="chat" style="display: none;"></div>
  </section>

<script>
  // Proxy CORS
  const CORS_PROXY = "https://api.allorigins.win/raw?url=";
  const CORS_PROXY_FALLBACK = "https://api.codetabs.com/v1/proxy?quest=";
  
  // WebSocket de Pusher
  const PUSHER_WS_URL = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=7.6.0&flash=false";
  
  let CHANNEL_ID = null;
  let USER_ID = null;
  let CHATROOM_ID = null;
  let CHAT_URL = null;
  let currentChannel = null;
  let kickWS = null;
  const chatDiv = document.getElementById("chat");
  const inputContainer = document.getElementById("channel-input-container");
  const channelInput = document.getElementById("channel-name-input");
  const loadBtn = document.getElementById("load-chat-btn");
  const statusMsg = document.getElementById("status-message");
  const linkContainer = document.getElementById("link-container");
  const generatedLink = document.getElementById("generated-link");
  const copyLinkBtn = document.getElementById("copy-link-btn");
  const openLinkBtn = document.getElementById("open-link-btn");
  let messageIds = new Set();
  let seventvEmoteSetId = null;   // ID del emote set del canal en 7TV
  let seventvEventSource = null;  // SSE connection al EventAPI de 7TV

  // ============ STORAGE ============
  let emotesData = {
    ffz: { global: {}, channel: {} },
    bttv: { global: {}, channel: {}, shared: {} },
    seventv: { global: {}, channel: {}, community: {} }
  };

  let subBadgesByMonths = {}; // "1", "2", "3", "6", "9", "12", "18", "24"

  const KICK_BADGES = {
    "moderator": "assets/mod.svg",
    "vip": "assets/vip.svg",
    "verified": "assets/verified.png",
    "broadcaster": "assets/broadcaster.png",
    "og": "assets/og.png",
    "subscriber": "assets/subscriber.png",
    "sub_gifter": "assets/sub_gifter.png",
    "founder": "assets/founder.png",
    "staff": "assets/staff.png"
  };

  const KICK_USERNAME_COLORS = [
    "#00ff66", "#53fc18", "#00c7ff", "#0095ff", "#1da1f2", "#00aeef",
    "#2f80ed", "#5865f2", "#8b5cf6", "#a855f7", "#d946ef", "#ff4ecd",
    "#ff5c8a", "#ff3864", "#e9113c", "#ff6a4a", "#ff9500", "#ffc900",
    "#facc15", "#22c55e", "#14b8a6", "#06b6d4"
  ];

  const KICK_USERNAME_OVERRIDES = {
    
  };

  const ENABLE_7TV_NAME_PAINTS = new URLSearchParams(window.location.search).get("paints") !== "off";

  const KICK_USERNAME_COLOR_NAMES = {
    green: "#00ff66",
    kick: "#53fc18",
    lime: "#53fc18",
    cyan: "#00c7ff",
    aqua: "#00c7ff",
    sky: "#00aeef",
    blue: "#0095ff",
    royal: "#2f80ed",
    indigo: "#5865f2",
    purple: "#8b5cf6",
    violet: "#a855f7",
    magenta: "#d946ef",
    pink: "#ff4ecd",
    rose: "#ff5c8a",
    red: "#e9113c",
    coral: "#ff6a4a",
    orange: "#ff9500",
    gold: "#ffc900",
    yellow: "#facc15",
    teal: "#14b8a6"
  };



  // ============ FETCH HELPERS ============
  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return params.get("channel");
  }

  function generateLink(channelName) {
    const baseUrl = window.location.href.split("?")[0];
    return `${baseUrl}?channel=${encodeURIComponent(channelName)}`;
  }

  async function fetchDirect(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort("timeout"), timeout);
    try {
      const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      throw err;
    }
  }

  async function fetchWithProxy(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort("timeout"), timeout);
    try {
      const proxyUrl = CORS_PROXY + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      try {
        const fallbackUrl = CORS_PROXY_FALLBACK + encodeURIComponent(url);
        const res2 = await fetch(fallbackUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeoutId);
        return await res2.json();
      } catch (err2) {
        clearTimeout(timeoutId);
        throw err2;
      }
    }
  }

  async function raceFetch(url) {
    return Promise.race([fetchDirect(url).catch(() => null), fetchWithProxy(url).catch(() => null)]).then(r => r || fetchWithProxy(url));
  }

  const smartFetch = raceFetch;

  // ============ CARGAR BADGES DE SUSCRIPTOR ============
  async function loadChannelSubBadges(channelSlug) {
    try {
      const data = await smartFetch(`https://kick.com/api/v2/channels/${channelSlug}/info`);

      subBadgesByMonths = {};

      if (data?.subscriber_badges && Array.isArray(data.subscriber_badges)) {
        data.subscriber_badges.forEach(badge => {
          const monthsKey = String(badge.months || badge.level || 1);
          let badgeUrl = badge.badge_image?.src
                      || badge.badge_image?.original
                      || badge.image_url
                      || badge.url;

          if (badgeUrl) {
            if (!badgeUrl.startsWith('http')) badgeUrl = `https:${badgeUrl}`;
            subBadgesByMonths[monthsKey] = badgeUrl;
          }
        });
      }

      // Fallback v1 si v2 falla
      if (Object.keys(subBadgesByMonths).length === 0) {
        const fallbackData = await smartFetch(`https://kick.com/api/v1/channels/${channelSlug}`);
        if (fallbackData?.subscriber_badges) {
          fallbackData.subscriber_badges.forEach(tier => {
            const monthsKey = String(tier.months || tier.level || 1);
            const badgeUrl = tier.image_url || tier.badge?.src || tier.badge_image?.src || tier.url;
            if (monthsKey && badgeUrl) {
              subBadgesByMonths[monthsKey] = badgeUrl.startsWith('http') ? badgeUrl : `https:${badgeUrl}`;
            }
          });
        }
      }

      if (Object.keys(subBadgesByMonths).length > 0) {
        const meses = Object.keys(subBadgesByMonths).sort((a,b)=>Number(a)-Number(b)).join(', ');
        statusMsg.textContent += ` | ${Object.keys(subBadgesByMonths).length} sub-badges (meses: ${meses})`;
      } else {
        statusMsg.textContent += " | No sub-badges personalizados";
      }
    } catch (err) {
      statusMsg.textContent += " | Error al cargar sub-badges";
    }
  }

  // ============ LÓGICA DE TIERS (según tu observación) ============
  function getSubBadgeKey(months) {
    const m = Number(months) || 1;

    if (m <= 3) return String(m);      // 1, 2, 3 → usa su propio badge
    if (m <= 5) return "3";            // 4, 5 → usa el de 3
    if (m <= 8) return "6";            // 6, 7, 8 → usa el de 6
    if (m <= 11) return "9";           // 9,10,11 → usa el de 9
    if (m <= 17) return "12";          // 12–17 → usa el de 12
    if (m <= 23) return "18";          // 18–23 → usa el de 18
    return "24";                       // 24+ → usa el de 24
  }

  // ============ GENERATE BADGES ============
  function generateBadges(m, cosmetics) {
    let html = "";
    const kickBadges = m.identity?.badges || m.sender?.identity?.badges || [];

    kickBadges.forEach(b => {
      const tipo = (b.type || "").toLowerCase();

      if (tipo === "subscriber") {
        const monthsRaw = b.months || b.count || b.level || b.duration || 1;
        const key = getSubBadgeKey(monthsRaw);

        let badgeUrl = subBadgesByMonths[key];

        // Fallback si falta el tier exacto
        if (!badgeUrl) {
          const orden = ["24","18","12","9","6","3","2","1"];
          for (const k of orden) {
            if (subBadgesByMonths[k]) {
              badgeUrl = subBadgesByMonths[k];
              break;
            }
          }
        }

        // Último fallback genérico
        if (!badgeUrl) {
          badgeUrl = "https://files.kick.com/channel_subscriber_badges/754874/original";
        }

        html += `<img src="${badgeUrl}" alt="Suscriptor ${monthsRaw} meses" class="badge-icon" title="Suscriptor ${monthsRaw} meses (tier ${key})" onerror="this.style.display='none'">`;
      } else {
        const icon = KICK_BADGES[tipo];
        if (icon) {
          html += `<img src="${icon}" alt="${tipo}" title="${b.text || tipo}" class="badge-icon" onerror="this.style.display='none'">`;
        }
      }
    });

    // 7TV badges
    if (cosmetics?.badges?.length) {
      cosmetics.badges.forEach(b => {
        const { src, srcset } = get7TVBadgeSrcSet(b);
        if (src) {
          const title = escapeHTML(b.tooltip || b.name || '7TV');
          const srcsetAttr = srcset ? ` srcset="${escapeHTML(srcset)}"` : "";
          html += `<img src="${src}"${srcsetAttr} alt="${title}" title="${title}" class="badge-icon" onerror="this.style.display='none'">`;
        }
      });
    }

    return html;
  }

  // ============ Resto del código (sin cambios importantes) ============

  let seventvUserCache = {};
  const seventvUserCachePromises = {}; // evita requests duplicados en vuelo
  let seventvGlobalPaintsPromise = null;
  let seventvPaintUsersById = {};
  const injected7TVPaintClasses = new Set();
  const injected7TVPaintOverlays = {};
  const injected7TVPaintHasLayers = {};
  const seventvEntitlementDebounce = {}; // debounce para eventos de entitlement por usuario

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function to7TVColor(value, fallback = null) {
    if (value === undefined || value === null) return fallback;
    if (typeof value === "object") {
      if (Number.isFinite(value.r) && Number.isFinite(value.g) && Number.isFinite(value.b)) {
        const alpha = Number.isFinite(value.a) ? Math.max(0, Math.min(1, value.a / 255)) : 1;
        return `rgba(${value.r}, ${value.g}, ${value.b}, ${alpha})`;
      }
      if (value.hex) return to7TVColor(value.hex, fallback);
    }
    if (typeof value === "number") {
      // 7TV empaqueta colores como int32 con signo en formato RGBA
      // (R=bits 31-24, G=23-16, B=15-8, A=7-0), igual que DecimalToStringRGBA de la extensión oficial.
      const u = value >>> 0;
      const r = (u >>> 24) & 0xff;
      const g = (u >>> 16) & 0xff;
      const b = (u >>> 8)  & 0xff;
      const a = (u & 0xff) / 255;
      if (a >= 0.99) return `rgb(${r}, ${g}, ${b})`;
      if (a <= 0.01) return fallback;   // alpha=0 → sin color definido, usar fallback
      return `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;
    }
    if (typeof value === "string") {
      const hex = value.startsWith("#") ? value.slice(1) : value;
      if (/^[0-9a-f]{8}$/i.test(hex)) {
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        const a = parseInt(hex.slice(6, 8), 16) / 255;
        if (a >= 0.99) return `rgb(${r}, ${g}, ${b})`;
        return `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;
      }
      if (/^#[0-9a-f]{3,6}$/i.test(value)) return value;
      if (/^[0-9a-f]{6}$/i.test(value)) return `#${value}`;
      if (/^-?\d+$/.test(value)) return to7TVColor(Number(value), fallback);
      if (/^(rgb|hsl)a?\(/i.test(value)) return value;
    }
    return fallback;
  }

  function pickByUsername(username, options) {
    const text = String(username || "");
    let hash = 0;
    for (let i = 0; i < text.length; i++) {
      hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
    }
    return options[Math.abs(hash) % options.length];
  }

  function normalizeKickUsernameColor(value, fallback = null) {
    if (typeof value === "string") {
      const namedColor = KICK_USERNAME_COLOR_NAMES[value.trim().toLowerCase()];
      if (namedColor) return namedColor;
    }
    return to7TVColor(value, fallback);
  }

  // Devuelve true si el color es demasiado claro para usarse en fondo oscuro
  function isColorTooLight(cssColor) {
    if (!cssColor) return false;
    // Detectar blanco puro o casi blanco (#fff, #ffffff, rgb(255,255,255), etc.)
    const clean = cssColor.replace(/\s/g, "").toLowerCase();
    if (clean === "#fff" || clean === "#ffffff" || clean === "white") return true;
    const m = clean.match(/^rgb\((\d+),(\d+),(\d+)\)$/);
    if (m) {
      const [r, g, b] = m.slice(1).map(Number);
      // Luminancia relativa: si > 0.85, demasiado claro
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.85;
    }
    return false;
  }

  function getKickUsernameColor(m) {
    const identity = m.identity || m.sender?.identity || {};
    const sender = m.sender || {};
    const normalizedUsername = sender.username?.toLowerCase();

    if (normalizedUsername && KICK_USERNAME_OVERRIDES[normalizedUsername]) {
      return KICK_USERNAME_OVERRIDES[normalizedUsername];
    }

    const colorCandidates = [
      identity.color,
      identity.colour,
      identity.name_color,
      identity.nameColour,
      identity.nameColor,
      identity.username_color,
      identity.usernameColour,
      identity.usernameColor,
      identity.chat_color,
      identity.chatColour,
      identity.chatColor,
      sender.color,
      sender.colour,
      sender.name_color,
      sender.nameColour,
      sender.nameColor,
      sender.username_color,
      sender.usernameColour,
      sender.usernameColor,
      sender.chat_color,
      sender.chatColour,
      sender.chatColor
    ];

    for (const value of colorCandidates) {
      const color = normalizeKickUsernameColor(value, null);
      // Ignorar colores demasiado claros (blanco/casi blanco) en fondo oscuro
      if (color && !isColorTooLight(color)) return color;
    }

    return pickByUsername(sender.username, KICK_USERNAME_COLORS);
  }

  function normalize7TVUrl(url) {
    if (!url) return "";
    if (url.startsWith("http")) return url;
    if (url.startsWith("//")) return `https:${url}`;
    if (url.startsWith("/")) return `https://cdn.7tv.app${url}`;
    return url;
  }

  function get7TVPaintClassName(paintId) {
    return `seventv-paint-${String(paintId || "").replace(/[^a-z0-9_-]/gi, "-")}`;
  }

  function get7TVPaintStyleSheet() {
    let styleEl = document.getElementById("seventv-paint-styles");
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.id = "seventv-paint-styles";
      document.head.appendChild(styleEl);
    }
    return styleEl;
  }

  function get7TVAssetUrl(asset, prefer1x = false) {
    if (asset?.images?.length) {
      const imgs = asset.images;
      if (prefer1x) {
        // Para badges pequeños: preferir 1x webp, fallback 1x cualquier formato, luego 2x
        return normalize7TVUrl(
          imgs.find(img => img.mime === "image/webp" && img.scale === 1)?.url
          || imgs.find(img => img.scale === 1)?.url
          || imgs.find(img => img.mime === "image/webp" && img.scale === 2)?.url
          || imgs.find(img => img.mime === "image/webp")?.url
          || imgs[0]?.url
        );
      }
      return normalize7TVUrl(
        imgs.find(img => img.mime === "image/webp" && img.scale >= 2)?.url
        || imgs.find(img => img.mime === "image/webp")?.url
        || imgs.find(img => img.scale >= 2)?.url
        || imgs[0]?.url
      );
    }

    const directUrl = asset?.url || asset?.image_url || asset?.icon_url;
    if (directUrl) return normalize7TVUrl(directUrl);

    const host = asset?.host || asset?.data?.host;
    const files = host?.files || [];
    const file = prefer1x
      ? (files.find(f => f.format === "WEBP" && f.name === "1x.webp")
        || files.find(f => f.name === "1x.webp")
        || files.find(f => f.format === "WEBP")
        || files[0])
      : (files.find(f => f.format === "WEBP" && /(?:2x|3x|4x)/i.test(f.name))
        || files.find(f => f.format === "WEBP")
        || files[0]);

    if (host?.url && file?.name) return normalize7TVUrl(`${host.url}/${file.name}`);
    return "";
  }

  // Genera src + srcset para badges de 7TV.
  // Los badges usan el patron: https://cdn.7tv.app/badge/{id}/{scale}x.webp (sin _static).
  function get7TVBadgeSrcSet(asset) {
    const badgeId = asset?.id || asset?.data?.id;

    // Ruta prioritaria: construir URL desde el ID del badge directamente (igual que hace 7TV)
    if (badgeId) {
      const base = `https://cdn.7tv.app/badge/${badgeId}`;
      const src = `${base}/1x.webp`;
      const srcset = `${base}/1x.webp 1x, ${base}/2x.webp 2x, ${base}/3x.webp 3x, ${base}/4x.webp 4x`;
      return { src, srcset };
    }

    // Fallback: images[] de v4 — filtrar _static para usar la version animada
    const imgs = asset?.images || [];
    if (imgs.length) {
      const webpImgs = imgs
        .filter(img => img.mime === "image/webp" && !img.url?.includes("_static"))
        .sort((a, b) => a.scale - b.scale);
      if (webpImgs.length) {
        const src = normalize7TVUrl(webpImgs[0].url);
        const srcset = webpImgs.map(img => `${normalize7TVUrl(img.url)} ${img.scale}x`).join(", ");
        return { src, srcset };
      }
      const allWebp = imgs.filter(img => img.mime === "image/webp").sort((a, b) => a.scale - b.scale);
      if (allWebp.length) {
        const src = normalize7TVUrl(allWebp[0].url);
        const srcset = allWebp.map(img => `${normalize7TVUrl(img.url)} ${img.scale}x`).join(", ");
        return { src, srcset };
      }
    }

    // Fallback v3 host/files — filtrar _static
    const host = asset?.host || asset?.data?.host;
    if (host?.url && host?.files?.length) {
      const webpFiles = host.files.filter(f => f.format === "WEBP" && !f.name?.includes("_static"));
      const filesToUse = webpFiles.length ? webpFiles : host.files.filter(f => f.format === "WEBP");
      if (filesToUse.length) {
        const src = normalize7TVUrl(`${host.url}/${filesToUse[0].name}`);
        const srcset = filesToUse.map(f => {
          const scale = f.name.match(/^(\d)x/)?.[1] || "1";
          return `${normalize7TVUrl(`${host.url}/${f.name}`)} ${scale}x`;
        }).join(", ");
        return { src, srcset };
      }
    }

    return { src: "", srcset: "" };
  }

  function get7TVPaintImageUrl(asset) {
    const images = asset?.images || asset?.image?.images || [];
    if (images.length) {
      return normalize7TVUrl(
        images.find(img => img.mime === "image/webp" && img.scale >= 4 && !img.url.includes("_static"))?.url
        || images.find(img => img.mime === "image/webp" && !img.url.includes("_static"))?.url
        || images.find(img => img.mime === "image/gif" && img.scale >= 4)?.url
        || images.find(img => img.mime === "image/gif")?.url
        || images.find(img => img.scale >= 4 && !img.url.includes("_static"))?.url
        || images.find(img => !img.url.includes("_static"))?.url
        || images.find(img => img.mime === "image/webp" && img.scale >= 4)?.url
        || images.find(img => img.mime === "image/webp")?.url
        || images[0]?.url
      );
    }

    return get7TVAssetUrl(asset);
  }

  function get7TVPaintLayers(paint) {
    const layers = paint?.data?.layers || paint?.layers || [];
    if (Array.isArray(layers) && layers.length) return layers;

    if (paint?.gradients?.length) {
      return paint.gradients.map(gradient => ({ gradient }));
    }

    // Formato v3/v2 legacy: function/stops/angle/shape/image_url están en el nivel
    // superior del paint (sin array). Algunos paints solo vienen así y se perdían.
    if (paint?.function || (Array.isArray(paint?.stops) && paint.stops.length) || paint?.image_url) {
      return [{
        gradient: {
          function: paint.function,
          stops: paint.stops || [],
          angle: paint.angle,
          shape: paint.shape,
          repeat: paint.repeat,
          image_url: paint.image_url,
          canvas_repeat: paint.canvas_repeat,
          canvas_size: paint.canvas_size,
          at: paint.at,
          size: paint.size
        }
      }];
    }

    return [];
  }

  function collect7TVPaintUserIds(paint) {
    return [
      ...(paint?.user_ids || []),
      ...(paint?.userIds || []),
      ...(paint?.users || []).map(user => user?.id || user?.user_id || user?.userId)
    ].filter(Boolean).map(String);
  }

  function pickActive7TVPaint(user) {
    const style = user?.style || {};
    const cosmetics = user?.cosmetics || [];
    const activePaintId = style.active_paint_id || style.paint_id || style.paint?.id || style.activePaint?.id;

    return style.activePaint
        || style.active_paint
        || style.paint
        || style.paints?.find(p => p.active)
        || style.paints?.[0]
        || cosmetics.find(c => c.kind === "PAINT" && c.id === activePaintId)?.data
        || cosmetics.find(c => c.type === "PAINT" && c.id === activePaintId)?.data
        || cosmetics.find(c => c.id === activePaintId)
        || null;
  }

  function pickActive7TVBadges(user) {
    const style = user?.style || {};
    const cosmetics = user?.cosmetics || [];
    const activeBadgeIds = [
      style.active_badge_id,
      style.badge_id,
      ...(style.active_badge_ids || []),
      ...(style.badge_ids || [])
    ].filter(Boolean);

    const styleBadges = style.activeBadges
                   || style.active_badges
                   || style.badges
                   || [];

    if (styleBadges.length) return styleBadges;
    if (!activeBadgeIds.length) return [];

    return cosmetics
      .filter(c => activeBadgeIds.includes(c.id) || activeBadgeIds.includes(c.badge_id))
      .map(c => c.data || c);
  }

  async function fetch7TVGraphQL(query, variables) {
    const res = await fetch("https://7tv.io/v4/gql", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query, variables }),
      cache: "no-store"
    });

    if (!res.ok) throw new Error(`7TV GraphQL ${res.status}`);
    const json = await res.json();
    if (json.errors?.length) throw new Error(json.errors[0].message || "7TV GraphQL error");
    return json.data;
  }

  async function fetch7TVV3GraphQL(query, variables = {}) {
    const res = await fetch("https://7tv.io/v3/gql", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query, variables }),
      cache: "no-store"
    });

    if (!res.ok) throw new Error(`7TV v3 GraphQL ${res.status}`);
    const json = await res.json();
    if (json.errors?.length) throw new Error(json.errors[0].message || "7TV v3 GraphQL error");
    return json.data;
  }

  const SEVENTV_GLOBAL_PAINTS_QUERY = `
    query {
      cosmetics {
        paints {
          id
          name
          color
          gradients {
            function
            canvas_repeat
            canvas_size
            at
            stops { at color }
            image_url
            shape
            angle
            repeat
          }
          shadows { x_offset y_offset radius color }
          text {
            weight
            transform
            variant
            shadows { x_offset y_offset radius color }
          }
        }
      }
    }
  `;

  async function fetch7TVGlobalPaints() {
    if (!seventvGlobalPaintsPromise) {
      seventvGlobalPaintsPromise = fetch7TVV3GraphQL(SEVENTV_GLOBAL_PAINTS_QUERY)
        .then(data => {
          const paints = data?.cosmetics?.paints || [];
          seventvPaintUsersById = {};
          paints.forEach(paint => {
            collect7TVPaintUserIds(paint).forEach(userId => {
              seventvPaintUsersById[userId] = paint.id;
            });
          });
          return Object.fromEntries(paints.map(p => [p.id, p]));
        })
        .catch(err => {
          seventvGlobalPaintsPromise = null;
          throw err;
        });
    }

    return seventvGlobalPaintsPromise;
  }

  // Caché de paints individuales fetcheados por ID
  const seventvPaintByIdCache = {};

  async function fetch7TVPaintById(paintId) {
    if (seventvPaintByIdCache[paintId] !== undefined) return seventvPaintByIdCache[paintId];

    // Query GraphQL v3 para un paint específico por ID
    const query = `
      query($id: ObjectID!) {
        cosmetic(id: $id) {
          ... on CosmeticPaint {
            id name kind
            color
            gradients {
              function canvas_repeat canvas_size at
              stops { at color }
              image_url shape angle repeat
            }
            shadows { x_offset y_offset radius color }
            text { weight transform variant shadows { x_offset y_offset radius color } }
          }
        }
      }
    `;

    try {
      const data = await fetch7TVV3GraphQL(query, { id: paintId });
      const paint = data?.cosmetic || null;
      seventvPaintByIdCache[paintId] = paint;
      return paint;
    } catch {
      // v3/cosmetics REST también da 404 — no hay fallback REST disponible
      seventvPaintByIdCache[paintId] = null;
      return null;
    }
  }

  async function enrich7TVPaintFromGlobal(paint) {
    if (!paint?.id) return paint || null;

    // Si el paint ya tiene capas v4 (data.layers), no necesita enriquecimiento
    const hasV4Layers = paint?.data?.layers?.length > 0;
    if (hasV4Layers) return paint;

    // Intentar con la caché global v3 primero (más rápido)
    try {
      const paintsById = await fetch7TVGlobalPaints();
      const globalPaint = paintsById[paint.id];
      if (globalPaint) {
        return {
          ...globalPaint,   // base v3 (gradients, color, shadows)
          ...paint,         // datos v4 encima (data.layers, name, id)
        };
      }
    } catch (err) {
    }

    // Si no está en el global, hacer fetch directo por ID (paints de suscripción/privados)
    try {
      const fetched = await fetch7TVPaintById(paint.id);
      if (fetched) return { ...fetched, ...paint };
    } catch {}

    return paint;
  }

  // Query con platformId (cuando tenemos el ID de Kick)
  const SEVENTV_QUERY_WITH_ID = `
    query($platformId: String!, $username: String!) {
      byConnection: users {
        userByConnection(platform: KICK, platformId: $platformId) {
          id
          mainConnection { platform platformId platformUsername }
          style {
            activePaint {
              id name
              data {
                layers {
                  id opacity
                  ty {
                    __typename
                    ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                    ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                    ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                    ... on PaintLayerTypeImage { images { url scale mime } }
                  }
                }
                shadows { color { hex r g b a } offsetX offsetY blur }
              }
            }
            activeBadge { id name images { url scale mime } }
          }
        }
      }
      bySearch: users {
        search(query: $username, page: 1, perPage: 5) {
          items {
            id
            mainConnection { platform platformId platformUsername }
            style {
              activePaint {
                id name
                data {
                  layers {
                    id opacity
                    ty {
                      __typename
                      ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                      ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeImage { images { url scale mime } }
                    }
                  }
                  shadows { color { hex r g b a } offsetX offsetY blur }
                }
              }
              activeBadge { id name images { url scale mime } }
            }
          }
        }
      }
    }
  `;

  // Query solo por username (cuando NO tenemos platformId válido)
  const SEVENTV_QUERY_SEARCH_ONLY = `
    query($username: String!) {
      bySearch: users {
        search(query: $username, page: 1, perPage: 5) {
          items {
            id
            mainConnection { platform platformId platformUsername }
            style {
              activePaint {
                id name
                data {
                  layers {
                    id opacity
                    ty {
                      __typename
                      ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                      ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeImage { images { url scale mime } }
                    }
                  }
                  shadows { color { hex r g b a } offsetX offsetY blur }
                }
              }
              activeBadge { id name images { url scale mime } }
            }
          }
        }
      }
    }
  `;

  // 7TV requiere que el platformId sea un ID numérico válido (≥ cierta longitud)
  function isValid7TVPlatformId(id) {
    const s = String(id || "");
    return /^\d{7,}$/.test(s);  // Kick IDs son numéricos y tienen varios dígitos
  }

  function normalize7TVGraphQLUser(data, kickUserId, username) {
    const exact = data?.byConnection?.userByConnection;
    const items = data?.bySearch?.search?.items || [];
    const normalizedUsername = username?.toLowerCase();
    const hasCosmetics = user => !!(user?.style?.activePaint || user?.style?.activeBadge);

    // 1. Coincidencia exacta por platformId de Kick (la más confiable)
    const byId = items.find(item => {
      const connection = item.mainConnection || {};
      return connection.platform === "KICK"
          && isValid7TVPlatformId(kickUserId)
          && connection.platformId === String(kickUserId);
    });

    // 2. Coincidencia exacta por username (case-insensitive, solo si el username coincide 100%)
    const byUsername = items.find(item =>
      item.mainConnection?.platformUsername?.toLowerCase() === normalizedUsername
    );

    // NO usar items[0] ni fallback por plataforma genérica — evita confundir usuarios similares
    const searched = byId || byUsername || null;

    // Preferir el resultado con cosméticos; byConnection tiene prioridad si tiene cosméticos
    const user = hasCosmetics(exact) ? exact
               : hasCosmetics(searched) ? searched
               : (exact || searched);
    if (!user) return null;

    return {
      paint: user.style?.activePaint || null,
      badges: user.style?.activeBadge ? [user.style.activeBadge] : []
    };
  }

  async function fetch7TVUserCosmetics(kickUserId, username = "") {
    const cacheKey = kickUserId || username?.toLowerCase();
    if (!cacheKey) return null;
    // Resultado ya cacheado
    if (seventvUserCache[cacheKey] !== undefined) return seventvUserCache[cacheKey];
    // Request ya en vuelo — reusar la misma promise
    if (seventvUserCachePromises[cacheKey]) return seventvUserCachePromises[cacheKey];

    seventvUserCachePromises[cacheKey] = _fetch7TVUserCosmeticsInner(kickUserId, username, cacheKey)
      .finally(() => { delete seventvUserCachePromises[cacheKey]; });
    return seventvUserCachePromises[cacheKey];
  }

  async function _fetch7TVUserCosmeticsInner(kickUserId, username, cacheKey) {

    if (username) {
      try {
        const useIdQuery = isValid7TVPlatformId(kickUserId);
        const query = useIdQuery ? SEVENTV_QUERY_WITH_ID : SEVENTV_QUERY_SEARCH_ONLY;
        const variables = useIdQuery
          ? { platformId: String(kickUserId), username }
          : { username };
        const data = await fetch7TVGraphQL(query, variables);
        const cosmetics = normalize7TVGraphQLUser(data, kickUserId, username);
        if (cosmetics?.paint || cosmetics?.badges?.length) {
          cosmetics.paint = await enrich7TVPaintFromGlobal(cosmetics.paint);
          seventvUserCache[cacheKey] = cosmetics;
          return cosmetics;
        }
      } catch (err) {
      }
    }

    // Fallback v3 por Kick ID — fetch silencioso para no loguear 404 en consola
    if (isValid7TVPlatformId(kickUserId)) {
      try {
        const res = await fetch(`https://7tv.io/v3/users/kick/${kickUserId}`, {
          method: 'GET', headers: { 'Accept': 'application/json' }, cache: 'no-store'
        });
        // 404 = usuario no tiene 7TV; cachear vacío sin lanzar error
        if (res.status === 404) {
          const empty = { paint: null, badges: [] };
          seventvUserCache[cacheKey] = empty;
          return empty;
        }
        if (!res.ok) throw new Error(`7TV v3 ${res.status}`);
        const data = await res.json();
        if (data?.user) {
          const cosmetics = {
            paint: pickActive7TVPaint(data.user),
            badges: pickActive7TVBadges(data.user)
          };
          cosmetics.paint = await enrich7TVPaintFromGlobal(cosmetics.paint);
          seventvUserCache[cacheKey] = cosmetics;
          return cosmetics;
        }
        // data sin .user → usuario sin 7TV, cachear null normalmente
      } catch {
        // 404 u otro error → cachear vacío para no repetir la petición en cada mensaje
        const empty = { paint: null, badges: [] };
        seventvUserCache[cacheKey] = empty;
        return empty;
      }
    }

    // Nota: el endpoint v3 REST de búsqueda por username (7tv.io/v3/users?query=...) ya no existe (404).
    // El fallback ahora es solo GraphQL v4 + v3/users/kick/{id}.

    seventvUserCache[cacheKey] = null;
    return null;
  }

  function processEmotes(text) {
    if (!text) return "";
    let result = text;

    // Kick native emotes
    result = result.replace(/\[emote:(\d+):([^\]]+)\]/g, (_, id) => 
      `<img src="https://files.kick.com/emotes/${id}/fullsize" class="emote">`
    );

    // 7TV community → global → bttv → ffz (orden de prioridad inverso al largo)
    [
      ...Object.entries(emotesData.seventv.community),
      ...Object.entries(emotesData.seventv.global),
      ...Object.entries(emotesData.bttv.global),
      ...Object.entries(emotesData.ffz.global)
    ]
    .sort((a,b) => b[0].length - a[0].length)
    .forEach(([code, emote]) => {
      const escaped = code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      result = result.replace(
        new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g'),
        `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" class="emote-third" alt="${code}" title="${code}" onerror="this.style.display='none'">`
      );
    });

    return result;
  }

  function build7TVShadowStyles(shadowsData) {
    const shadows = (shadowsData || [])
      .map(s => {
        const color = to7TVColor(s.color, "rgba(0,0,0,.85)");
        const x = s.x_offset ?? s.offsetX ?? 0;
        const y = s.y_offset ?? s.offsetY ?? 0;
        const blur = s.radius ?? s.blur ?? 0;
        return { x, y, blur, color };
      });

    if (!shadows.length) return "";

    const textShadow = shadows
      .map(s => `${s.x}px ${s.y}px ${s.blur}px ${s.color}`)
      .join(", ");
    const filterShadow = shadows
      .map(s => `drop-shadow(${s.x}px ${s.y}px ${s.blur}px ${s.color})`)
      .join(" ");

    return ` text-shadow: ${textShadow}; filter: ${filterShadow};`;
  }

  function build7TVTextShadowStyle(shadowsData) {
    const textShadow = (shadowsData || [])
      .map(s => {
        const color = to7TVColor(s.color, "rgba(0,0,0,.85)");
        const x = s.x_offset ?? s.offsetX ?? 0;
        const y = s.y_offset ?? s.offsetY ?? 0;
        const blur = s.radius ?? s.blur ?? 0;
        return `${x}px ${y}px ${blur}px ${color}`;
      })
      .filter(Boolean)
      .join(", ");

    return textShadow ? ` text-shadow: ${textShadow};` : "";
  }

  // Convierte un par [x, y] normalizado (0..1) de 7TV a un string CSS "X% Y%".
  // Acepta arrays, objetos {x,y} o valores sueltos. Devuelve null si no hay dato.
  function pairToPercent(value) {
    if (value == null) return null;
    let x, y;
    if (Array.isArray(value)) {
      if (value.length < 2) return null;
      x = Number(value[0]); y = Number(value[1]);
    } else if (typeof value === "object") {
      x = Number(value.x); y = Number(value.y);
    } else {
      return null;
    }
    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
    return `${(x * 100).toFixed(2)}% ${(y * 100).toFixed(2)}%`;
  }

  // Normaliza el valor canvas_repeat de 7TV ("no-repeat" | "repeat" | "repeat-x" | "repeat-y" | "" )
  function normalizeCanvasRepeat(value) {
    const v = String(value || "").toLowerCase().trim();
    if (["repeat", "repeat-x", "repeat-y", "no-repeat", "round", "space"].includes(v)) return v;
    return null;
  }

  // Construye el stack de capas de un paint replicando la extensión oficial de 7TV.
  // Cada capa produce { image, position, size, repeat } que luego se combinan en
  // background-image / background-position / background-size / background-repeat.
  // El orden del array se respeta: la capa 0 queda ARRIBA (igual que en CSS).
  function build7TVPaintBackgroundLayers(paint, base) {
    const layers = [];          // { image, position, size, repeat }
    let hasImageLayer = false;

    get7TVPaintLayers(paint).forEach(layer => {
      const ty = layer.ty || layer.image || {};
      const gradient = layer.gradient || layer.linearGradient || layer.radialGradient || ty;
      // Opacidad por capa (v4): 1.0 opaco, <1 semitransparente. Se multiplica al alpha del color.
      const layerOpacity = (layer.opacity != null && layer.opacity >= 0 && layer.opacity <= 1)
        ? layer.opacity : 1;

      const colorWithOpacity = (colorVal) => {
        const css = to7TVColor(colorVal, base);
        if (!css || layerOpacity >= 1) return css;
        const mRgba = css.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)$/);
        if (mRgba) {
          const a = (mRgba[4] != null ? parseFloat(mRgba[4]) : 1) * layerOpacity;
          return `rgba(${mRgba[1]}, ${mRgba[2]}, ${mRgba[3]}, ${a.toFixed(3)})`;
        }
        return css;
      };

      const push = (image, { position = null, size = null, repeat = null } = {}) => {
        layers.push({ image, position, size, repeat });
      };

      // ---- Formato v4: capas tipadas (PaintLayerType*) ----
      if (ty.__typename === "PaintLayerTypeSingleColor" && ty.color) {
        // Un color sólido se renderiza como gradiente de un solo color para
        // conservar su posición dentro del stack (NO se saca como color: del texto).
        const c = colorWithOpacity(ty.color);
        push(`linear-gradient(${c}, ${c})`);
        return;
      }

      if ((ty.__typename === "PaintLayerTypeLinearGradient" || ty.__typename === "PaintLayerTypeRadialGradient") && ty.stops?.length) {
        const stops = ty.stops
          .map(s => `${colorWithOpacity(s.color)} ${(Math.max(0, Math.min(1, Number(s.at || 0))) * 100).toFixed(2)}%`)
          .join(", ");
        if (ty.__typename === "PaintLayerTypeRadialGradient") {
          const shape = ty.shape ? String(ty.shape).toLowerCase() : "circle";
          push(`${ty.repeating ? "repeating-" : ""}radial-gradient(${shape}, ${stops})`);
        } else {
          // 7TV guarda el ángulo YA en grados CSS (0=arriba, sentido horario). Se usa tal cual.
          const cssAngle = Number(ty.angle ?? 0);
          push(`${ty.repeating ? "repeating-" : ""}linear-gradient(${cssAngle}deg, ${stops})`);
        }
        return;
      }

      // Capa imagen v4
      const v4ImageUrl = (ty.__typename === "PaintLayerTypeImage")
        ? (get7TVPaintImageUrl(ty) || get7TVPaintImageUrl(layer))
        : "";
      if (v4ImageUrl) {
        hasImageLayer = true;
        push(`url("${v4ImageUrl}")`, { size: "contain", repeat: "no-repeat" });
        return;
      }

      // ---- Formato v3/v2: objeto gradient con function/stops/at/canvas_size ----
      const gradientFunction = String(gradient.function || "").toUpperCase();
      const gradientImageUrl = normalize7TVUrl(gradient.image_url || "");
      if (gradientImageUrl && gradientFunction.includes("URL")) {
        hasImageLayer = true;
        push(`url("${gradientImageUrl}")`, { size: "contain", repeat: "no-repeat" });
        return;
      }

      const stops = (gradient.stops || [])
        .map(s => {
          const color = colorWithOpacity(s.color);
          const rawAt = Number(s.at ?? 0);
          const at = Math.max(0, Math.min(1, rawAt > 1 ? rawAt / 100 : rawAt));
          return `${color} ${(at * 100).toFixed(2)}%`;
        })
        .join(", ");

      if (!stops) return;

      // Posición (at) y tamaño (size/canvas_size) por capa — clave para paints complejos.
      const position = pairToPercent(gradient.at);
      const size = pairToPercent(gradient.size) || pairToPercent(gradient.canvas_size);
      const repeat = normalizeCanvasRepeat(gradient.canvas_repeat);

      let image;
      if (gradientFunction.includes("RADIAL")) {
        const shape = gradient.shape ? String(gradient.shape).toLowerCase() : "circle";
        image = `${gradient.repeat ? "repeating-" : ""}radial-gradient(${shape}, ${stops})`;
      } else {
        // v3 también guarda el ángulo en grados CSS — usar directamente (sin "90 - angle").
        const cssAngle = Number(gradient.angle ?? 0);
        image = `${gradient.repeat ? "repeating-" : ""}linear-gradient(${cssAngle}deg, ${stops})`;
      }
      push(image, { position, size, repeat });
    });

    return {
      layers,
      hasImageLayer,
      // color: solo como fallback (texto plano si el clip falla). 7TV usa paint.data.color.
      solidColor: to7TVColor(paint?.color, null)
    };
  }

  // Overrides manuales para paints que la API no devuelve correctamente.
  // Clave: paint ID de 7TV. Valor: CSS a inyectar directamente.
  const SEVENTV_PAINT_OVERRIDES = {
    // Scorched — repeating-linear-gradient a 135° con colores de fuego/quemado
    "01JWHCF4H5QQVNXGXWZBNGM9QT": (base) =>
      `background-image: repeating-linear-gradient(135deg, rgb(188, 21, 54) 0%, rgb(247, 29, 18) 12%, rgb(255, 131, 12) 12%, rgb(247, 29, 18) 23%, rgb(255, 131, 12) 23%, rgb(255, 131, 12) 33%);` +
      ` background-position: center; background-size: 100% 100%; background-repeat: no-repeat;` +
      ` -webkit-background-clip: text; background-clip: text;` +
      ` -webkit-text-fill-color: transparent; -webkit-text-stroke: 0px;` +
      ` filter: drop-shadow(rgb(204, 31, 0) 0px 0px 0.1px); color: ${base};`
  };

  function ensure7TVPaintClass(paint, base) {
    if (!paint?.id) return "";

    const className = get7TVPaintClassName(paint.id);

    // Override manual: algunos paints no se reciben bien de la API — usar CSS directo
    if (SEVENTV_PAINT_OVERRIDES[paint.id]) {
      if (!injected7TVPaintClasses.has(className)) {
        const overrideCSS = SEVENTV_PAINT_OVERRIDES[paint.id](base);
        get7TVPaintStyleSheet().appendChild(document.createTextNode(`.${className}{${overrideCSS}}\n`));
        injected7TVPaintClasses.add(className);
        injected7TVPaintOverlays[className] = false;
        injected7TVPaintHasLayers[className] = true;
      }
      return { className, hasOverlay: false };
    }

    // Verificar si el paint tiene capas reales; si ya está cacheado con datos buenos, reutilizar
    const hasRealLayers = (paint?.data?.layers?.length > 0) || (paint?.gradients?.length > 0) || (paint?.color != null);
    if (injected7TVPaintClasses.has(className)) {
      // Si está cacheado pero el paint actual tiene más datos, invalidar y reinyectar
      const cachedHasLayers = injected7TVPaintHasLayers?.[className];
      if (cachedHasLayers || !hasRealLayers) {
        return { className, hasOverlay: !!injected7TVPaintOverlays[className] };
      }
      // Tiene nuevos datos — eliminar regla CSS antigua del stylesheet antes de reinyectar
      const styleEl = get7TVPaintStyleSheet();
      for (let i = styleEl.childNodes.length - 1; i >= 0; i--) {
        if (styleEl.childNodes[i].textContent?.includes(`.${className}{`)) {
          styleEl.removeChild(styleEl.childNodes[i]);
        }
      }
      injected7TVPaintClasses.delete(className);
      delete injected7TVPaintOverlays[className];
      delete injected7TVPaintHasLayers[className];
    }

    const { layers, hasImageLayer, solidColor } = build7TVPaintBackgroundLayers(paint, base);
    const shadowsData = [
      ...(paint.shadows || []),
      ...(paint.text?.shadows || []),
      ...(!paint.shadows?.length && !paint.text?.shadows?.length ? (paint.data?.shadows || []) : [])
    ];
    // Las sombras van como filter:drop-shadow() — funciona con background-clip:text.
    // text-shadow NO funciona cuando -webkit-text-fill-color:transparent.
    const shadowStyles = build7TVShadowStyles(shadowsData);
    const color = solidColor || "var(--kick-name-color)";

    // Imagen (paint animado) → se mantiene la ruta de overlay ::after existente.
    // El overlay usa el stack completo de imágenes.
    const imageStack = layers.map(l => l.image).join(", ");

    let declarations;
    if (hasImageLayer) {
      declarations = `color: ${color}; --seventv-paint-bg: ${imageStack}; --seventv-paint-opacity: 1.0;${shadowStyles}`;
    } else if (layers.length) {
      // Cada propiedad se compone por capa, replicando a la extensión oficial de 7TV.
      // Si una capa no define posición/tamaño/repeat usamos valores que cubren todo el texto.
      const bgImage    = layers.map(l => l.image).join(", ");
      const bgPosition = layers.map(l => l.position || "center").join(", ");
      const bgSize     = layers.map(l => l.size || "100% 100%").join(", ");
      const bgRepeat   = layers.map(l => l.repeat || "no-repeat").join(", ");
      declarations =
        `color: ${color};` +
        ` background-image: ${bgImage};` +
        ` background-position: ${bgPosition};` +
        ` background-size: ${bgSize};` +
        ` background-repeat: ${bgRepeat};` +
        ` -webkit-background-clip: text; background-clip: text;` +
        ` -webkit-text-fill-color: transparent; -webkit-text-stroke: 0px;` +
        shadowStyles;
    } else {
      declarations = `color: ${color};${shadowStyles}`;
    }

    get7TVPaintStyleSheet().appendChild(document.createTextNode(`.${className}{${declarations}}\n`));
    injected7TVPaintClasses.add(className);
    injected7TVPaintOverlays[className] = hasImageLayer;
    injected7TVPaintHasLayers[className] = hasRealLayers;
    return { className, hasOverlay: hasImageLayer };
  }

  function generateNamePaint(m, cosmetics) {
    const base = getKickUsernameColor(m);
    const style = `--kick-name-color: ${base}; color: ${base};`;
    const paint = cosmetics?.paint;

    // Aplicar paint si tiene ID válido (aunque no tenga capas aún —
    // enrich puede haberle agregado color/gradients desde la caché global v3)
    const paintHasData = !!paint?.id;

    const paintClass = (ENABLE_7TV_NAME_PAINTS && paintHasData)
      ? ensure7TVPaintClass(paint, base)
      : null;

    return {
      style,
      className: paintClass?.className || "",
      hasOverlay: !!paintClass?.hasOverlay
    };
  }

  async function addMessage(m) {
    if (messageIds.has(m.id)) return;
    messageIds.add(m.id);

    const username = m.sender?.username || m.sender?.slug || "Anónimo";
    const kickUserId = m.sender?.id || "";
    const content = processEmotes(m.content);

    // Insertar el mensaje de inmediato con el color de Kick (sin esperar 7TV)
    // para evitar race conditions de orden cuando llegan mensajes simultáneos
    const baseColor = getKickUsernameColor(m);
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.dataset.msgId = m.id;
    if (kickUserId) msg.dataset.kickUserId = String(kickUserId);
    // Guardar badges de Kick en el elemento para que re-renders posteriores no los pierdan
    const kickIdentityBadges = m.identity?.badges || m.sender?.identity?.badges || [];
    msg.dataset.kickBadges = JSON.stringify(kickIdentityBadges);
    // Renderizar badges de Kick inmediatamente (no esperamos a 7TV)
    const initialBadgesHTML = generateBadges(m, null);
    msg.innerHTML = `
      <span class="meta">
        <span class="user">${initialBadgesHTML}<span class="username-text" data-username="${escapeHTML(username)}" data-7tv-overlay="false" data-7tv-paint="" style="--kick-name-color: ${baseColor}; color: ${baseColor};">${escapeHTML(username)}</span></span>
      </span>
      <span class="text">${content}</span>
    `;
    chatDiv.appendChild(msg);
    chatDiv.scrollTop = chatDiv.scrollHeight;

    // Aplicar cosméticos si ya están en caché
    const cachedCosmetics = seventvUserCache[kickUserId] || seventvUserCache[username?.toLowerCase()];
    if (cachedCosmetics) {
      applyCosmetics(msg, m, username, kickUserId, cachedCosmetics);
    } else if (kickUserId && seventvUserCache[kickUserId] === undefined && !seventvUserCachePromises[kickUserId]) {
      // Primera vez que este usuario escribe — fetch en background, aplicar cuando llegue
      fetch7TVUserCosmetics(kickUserId, username).then(cosmetics => {
        if (!cosmetics?.paint && !cosmetics?.badges?.length) return;
        // Aplicar a todos los mensajes de este usuario que estén en el DOM
        document.querySelectorAll(`.msg[data-kick-user-id="${kickUserId}"]`).forEach(msgEl => {
          const uname = msgEl.querySelector(".username-text")?.dataset?.username || username;
          const storedKickBadges = msgEl.dataset.kickBadges ? JSON.parse(msgEl.dataset.kickBadges) : [];
          const fakeM = { sender: { username: uname, id: kickUserId }, identity: { badges: storedKickBadges } };
          applyCosmetics(msgEl, fakeM, uname, kickUserId, cosmetics);
        });
      }).catch(() => {});
    }
  }

  // Aplica badges y paint a un elemento de mensaje ya en el DOM
  function applyCosmetics(msgEl, m, username, kickUserId, cosmetics) {
    const userSpan = msgEl.querySelector(".user");
    if (!userSpan) return;
    // Recuperar badges de Kick guardados en el elemento si el objeto m no los tiene
    const storedBadges = msgEl.dataset.kickBadges ? JSON.parse(msgEl.dataset.kickBadges) : [];
    const mWithBadges = (m.identity?.badges?.length || m.sender?.identity?.badges?.length)
      ? m
      : { ...m, identity: { ...(m.identity || {}), badges: storedBadges } };
    const badgesHTML = generateBadges(mWithBadges, cosmetics);
    const namePaint  = generateNamePaint(m, cosmetics);
    const paintName  = cosmetics?.paint?.name || "";
    const badgeNames = cosmetics?.badges?.map(b => b.name || b.tooltip).filter(Boolean).join(", ") || "";
    const cosmeticsTitle = [paintName && `7TV paint: ${paintName}`, badgeNames && `7TV badge: ${badgeNames}`].filter(Boolean).join(" | ");
    userSpan.innerHTML = `${badgesHTML}<span class="username-text ${escapeHTML(namePaint.className)}" data-username="${escapeHTML(username)}" data-7tv-overlay="${namePaint.hasOverlay ? "true" : "false"}" data-7tv-paint="${escapeHTML(paintName)}" title="${escapeHTML(cosmeticsTitle)}" style="${namePaint.style}">${escapeHTML(username)}</span>`;
  }

  async function getChannelId(channelSlug) {
    statusMsg.textContent = "Obteniendo canal...";
    statusMsg.style.color = "#53fc18";

    // Intentar v2 primero, luego v1 como fallback
    const endpoints = [
      `https://kick.com/api/v2/channels/${channelSlug}`,
      `https://kick.com/api/v1/channels/${channelSlug}`,
    ];

    let lastErr = null;
    for (const url of endpoints) {
      try {
        const data = await smartFetch(url);
        // v2 puede devolver {data: {...}} o directo
        const ch = data?.data || data;
        const channelId = ch?.id ?? ch?.channel_id ?? ch?.channelId;
        const chatroomId = ch?.chatroom?.id ?? ch?.chatroom_id;
        // user_id es distinto a id — 7TV usa user_id para identificar al streamer en Kick
        const userId = ch?.user_id ?? ch?.userId ?? ch?.user?.id ?? channelId;
        if (!channelId) throw new Error("ID de canal no encontrado en respuesta");
        return {
          channelId,
          userId,
          chatroomId,
          isLive: !!(ch?.livestream?.id ?? ch?.is_live ?? ch?.live)
        };
      } catch (err) {
        lastErr = err;
      }
    }

    statusMsg.textContent = "Error: " + lastErr.message;
    statusMsg.style.color = "#ff4444";
    throw lastErr;
  }

  async function loadChat() {
    const channelName = channelInput.value.trim().toLowerCase();
    if (!channelName) {
      statusMsg.textContent = "Ingresa un nombre de canal";
      statusMsg.style.color = "#ff4444";
      return;
    }

    try {
      const result = await getChannelId(channelName);
      CHANNEL_ID = result.channelId;
      USER_ID = result.userId;
      CHATROOM_ID = result.chatroomId;
      currentChannel = channelName;
      CHAT_URL = `https://kick.com/api/v2/channels/${CHANNEL_ID}/messages`;

      await loadChannelSubBadges(channelName);
      await loadAllThirdPartyData(channelName, USER_ID);

      const isDirectLink = getUrlParams() !== null;
      if (isDirectLink) {
        inputContainer.style.display = "none";
        chatDiv.style.display = "flex";
      } else {
        statusMsg.textContent = result.isLive ? `🔴 EN VIVO: ${channelName}` : `⚫ OFFLINE: ${channelName}`;
        statusMsg.style.color = result.isLive ? "#53fc18" : "#ffaa00";
        generatedLink.value = generateLink(channelName);
        linkContainer.style.display = "block";
        channelInput.style.display = "none";
        loadBtn.style.display = "none";
        chatDiv.style.display = "flex";
      }

      chatDiv.innerHTML = "";
      messageIds.clear();

      connectWebSocket();
      fetchInitialMessages();
      connect7TVEventAPI();  // cosméticos y emotes en tiempo real
    } catch (err) {
    }
  }


  // ============ 7TV EVENT API (cosméticos y emotes en tiempo real) ============

  function connect7TVEventAPI() {
    if (seventvEventSource) {
      seventvEventSource.close();
      seventvEventSource = null;
    }
    if (!USER_ID) return;

    // Construir topics: entitlements + cosméticos del canal, y emote set si está disponible
    const topics = [
      `entitlement.*<ctx=channel;platform=KICK;id=${USER_ID}>`,
      `cosmetic.*<ctx=channel;platform=KICK;id=${USER_ID}>`
    ];
    if (seventvEmoteSetId) {
      topics.push(`emote_set.*<object_id=${seventvEmoteSetId}>`);
    }

    const url = `https://events.7tv.io/v3@${topics.map(encodeURIComponent).join(",")}`;

    const es = new EventSource(url);
    seventvEventSource = es;

    es.addEventListener("open", () => {
    });

    // Evento principal de 7TV: llega como "dispatch"
    es.addEventListener("dispatch", (e) => {
      try {
        handle7TVEvent(JSON.parse(e.data));
      } catch (err) {
      }
    });

    // También puede llegar sin nombre de evento (message genérico)
    es.onmessage = (e) => {
      try {
        const parsed = JSON.parse(e.data);
        if (parsed.type || parsed.t) handle7TVEvent(parsed);
      } catch {}
    };

    es.onerror = () => {
      es.close();
      seventvEventSource = null;
      setTimeout(() => {
        // Solo reconectar si seguimos en el mismo canal
        if (USER_ID) connect7TVEventAPI();
      }, 5000);
    };
  }

  function handle7TVEvent(payload) {
    // 7TV EventAPI v3: { type: "emote_set.update", body: { id, pushed, pulled, updated } }
    // También puede llegar como { t, d } en algunas versiones
    const type  = (payload.type || payload.t || "").toLowerCase();
    const body  = payload.body ?? payload.d ?? {};
    // El body a veces ES el payload si ya viene aplanado
    const data  = (body && typeof body === "object" && Object.keys(body).length) ? body : payload;


    if (type.startsWith("emote_set.")) {
      // Solo procesar el set del canal del streamer; ignorar sets personales de espectadores
      const setId = data?.id || data?.object?.id;
      if (!seventvEmoteSetId || setId === seventvEmoteSetId) {
        handle7TVEmoteSetEvent(type, data);
      } else {
      }
    } else if (type.startsWith("entitlement.") || type.startsWith("cosmetic.")) {
      handle7TVEntitlementEvent(type, data);
    }
  }

  function handle7TVEmoteSetEvent(topic, data) {
    const pushed = data?.pushed || [];
    const pulled  = data?.pulled  || [];
    const updated = data?.updated || [];

    // Agregar emotes nuevos
    pushed.forEach(item => {
      const e = item?.value || item;
      const host = e?.data?.host;
      if (!host) return;
      const file = host.files?.find(f => f.format === "WEBP") || host.files?.[0];
      if (file && e.name) {
        emotesData.seventv.community[e.name] = {
          url: `https:${host.url}/${file.name}`,
          url2x: `https:${host.url}/${host.files[1]?.name || file.name}`
        };
      }
    });

    // Quitar emotes eliminados
    pulled.forEach(item => {
      const name = item?.old_value?.name || item?.value?.name || item?.name;
      if (name && emotesData.seventv.community[name]) {
        delete emotesData.seventv.community[name];
      }
    });

    // Emotes renombrados: actualizar clave
    updated.forEach(item => {
      const oldName = item?.old_value?.name;
      const newName = item?.value?.name;
      if (oldName && newName && oldName !== newName) {
        const existing = emotesData.seventv.community[oldName];
        if (existing) {
          emotesData.seventv.community[newName] = existing;
          delete emotesData.seventv.community[oldName];
        }
      }
    });
  }

  function handle7TVEntitlementEvent(topic, data) {
    // Estructura real del EventAPI v3:
    // entitlement.create { id, kind, object: { id, kind, user: { id, connections: [{platform, id, username}] }, ref_id } }
    // kind 5 = PAINT, kind 10 = BADGE
    const obj = data?.object || data;
    const user7tv = obj?.user || obj?.ref?.user || null;

    // Extraer conexión de Kick del usuario afectado
    const connections = user7tv?.connections || [];
    const kickConn = connections.find(c =>
      (c.platform || "").toUpperCase() === "KICK"
    );
    const kickUserId = kickConn?.id || kickConn?.platform_id || null;
    const username   = kickConn?.username || kickConn?.platform_username || "";

    if (!kickUserId) {
      return;
    }

    const cacheKey = String(kickUserId);
    const kind = data?.kind ?? obj?.kind;

    // Extraer el paint/badge directamente del evento — no necesitamos re-fetchear
    // El ref_id apunta al cosmético; si viene el objeto completo, usarlo directo
    const cosmeticRef = obj?.ref_id || null;

    // Debounce: si ya hay un fetch pendiente para este usuario en los últimos 3s, cancelar el anterior
    if (seventvEntitlementDebounce[cacheKey]) {
      clearTimeout(seventvEntitlementDebounce[cacheKey]);
    }

    seventvEntitlementDebounce[cacheKey] = setTimeout(() => {
      delete seventvEntitlementDebounce[cacheKey];

    // Invalidar caché de este usuario
    delete seventvUserCache[cacheKey];
    delete seventvUserCachePromises[cacheKey];

    // Re-fetch cosméticos con GraphQL (ahora tenemos kickUserId y username exactos)
    fetch7TVUserCosmetics(cacheKey, username).then(cosmetics => {
      // Si GraphQL no devolvió paint pero el evento trae ref_id, construir desde el evento
      // (pasa cuando v3/users/kick/{id} da 404 para ese usuario)
      if (cosmeticRef && kind === 5 && (!cosmetics?.paint)) {
        if (!cosmetics) cosmetics = { paint: null, badges: [] };
        cosmetics.paint = { id: cosmeticRef };
      }
      if (cosmeticRef && kind === 10 && (!cosmetics?.badges?.length)) {
        if (!cosmetics) cosmetics = { paint: null, badges: [] };
        if (!cosmetics.badges.some(b => b.id === cosmeticRef)) {
          cosmetics.badges = [{ id: cosmeticRef }];
        }
      }
      if (!cosmetics) return;

      // Enriquecer el paint con datos v3 globales si es necesario
      const enrichAndRender = (cos) => {
        // Re-renderizar todos los mensajes visibles de este usuario en el DOM
        // Buscar mensajes del usuario por kickUserId (más preciso) o username como fallback
      const selector = kickUserId
        ? `.msg[data-kick-user-id="${kickUserId}"]`
        : `.msg[data-msg-id]`;
      document.querySelectorAll(selector).forEach(msgEl => {
          const userSpan = msgEl.querySelector(".username-text");
          if (!userSpan) return;
          const uname = userSpan.dataset.username || "";
          if (!uname) return;
          // Si buscamos por username (fallback), filtrar manualmente
          if (!kickUserId && uname.toLowerCase() !== username.toLowerCase()) return;
          // Recuperar badges de Kick del dataset del elemento
          const storedKickBadges = msgEl.dataset.kickBadges ? JSON.parse(msgEl.dataset.kickBadges) : [];
          const fakeM = { sender: { username: uname, id: kickUserId || cacheKey }, identity: { badges: storedKickBadges } };
          applyCosmetics(msgEl, fakeM, uname, kickUserId || cacheKey, cos);
        });
      };

      if (cosmetics.paint?.id && !cosmetics.paint?.data?.layers?.length && !cosmetics.paint?.gradients?.length) {
        enrich7TVPaintFromGlobal(cosmetics.paint).then(enriched => {
          cosmetics.paint = enriched;
          seventvUserCache[cacheKey] = cosmetics;
          enrichAndRender(cosmetics);
        });
      } else {
        seventvUserCache[cacheKey] = cosmetics;
        enrichAndRender(cosmetics);
      }
    }).catch(() => {});

    }, 3000); // esperar 3s antes de hacer el fetch, por si llegan más eventos del mismo usuario
  }

  function connectWebSocket() {
    if (kickWS) kickWS.close();
    kickWS = new WebSocket(PUSHER_WS_URL);

    kickWS.addEventListener("open", () => {
      kickWS.send(JSON.stringify({
        event: "pusher:subscribe",
        data: { auth: "", channel: `chatrooms.${CHATROOM_ID}.v2` }
      }));
    });

    kickWS.addEventListener("message", (event) => {
      try {
        const parsed = JSON.parse(event.data);
        if (parsed.event === "App\\Events\\ChatMessageEvent") {
          const data = JSON.parse(parsed.data);
          // Normalizar: asegurar sender.username (Pusher a veces trae slug en vez de username)
          if (data.sender && !data.sender.username && data.sender.slug) {
            data.sender.username = data.sender.slug;
          }
          // Propagar identity al nivel raíz para que getKickUsernameColor lo encuentre
          if (data.sender?.identity && !data.identity) {
            data.identity = data.sender.identity;
          }
          addMessage(data);
        }
      } catch {}
    });

    kickWS.addEventListener("error", () => setTimeout(connectWebSocket, 1500));
    kickWS.addEventListener("close", () => setTimeout(connectWebSocket, 1500));
  }

async function fetchInitialMessages() {
  if (!CHAT_URL) return;

  try {
    const data = await raceFetch(CHAT_URL);
    const msgs = data?.data?.messages || data?.messages || [];
    let loaded = 0;

    if (msgs.length) {
      msgs.reverse().forEach(m => {
        if (!messageIds.has(m.id)) {
          addMessage(m);
          loaded++;
        }
      });
      statusMsg.textContent += ` | ${loaded} mensajes históricos`;

      // Pre-cargar cosméticos de los usuarios únicos del historial en paralelo,
      // luego aplicarlos a sus mensajes ya en el DOM
      const uniqueUsers = [];
      const seen = new Set();
      msgs.forEach(m => {
        const id = String(m.sender?.id || "");
        const username = m.sender?.username || m.sender?.slug || "";
        if (id && !seen.has(id)) {
          seen.add(id);
          uniqueUsers.push({ id, username });
        }
      });

      // Fetch en paralelo, máx 3 a la vez para no saturar — limitado a 20 usuarios únicos
      const CHUNK = 3;
      const usersToFetch = uniqueUsers.slice(0, 20);
      for (let i = 0; i < usersToFetch.length; i += CHUNK) {
        await Promise.allSettled(
          usersToFetch.slice(i, i + CHUNK).map(({ id, username }) =>
            fetch7TVUserCosmetics(id, username).then(cosmetics => {
              if (!cosmetics?.paint && !cosmetics?.badges?.length) return;
              // Aplicar a todos los mensajes de ese usuario ya en el DOM
              document.querySelectorAll(`.msg[data-kick-user-id="${id}"]`).forEach(msgEl => {
                const uname = msgEl.querySelector(".username-text")?.dataset?.username || username;
                const storedKickBadges = msgEl.dataset.kickBadges ? JSON.parse(msgEl.dataset.kickBadges) : [];
                const fakeM = { sender: { username: uname, id }, identity: { badges: storedKickBadges } };
                applyCosmetics(msgEl, fakeM, uname, id, cosmetics);
              });
            })
          )
        );
      }
    }
  } catch (e) {
    // La API de mensajes puede requerir auth — no es crítico, el WebSocket funciona igual
  }
}

  // Eventos
  copyLinkBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(generatedLink.value);
    copyLinkBtn.textContent = "Copiado ✓";
    setTimeout(() => copyLinkBtn.textContent = "📋 Copiar", 1800);
  });

  openLinkBtn.addEventListener("click", () => window.open(generatedLink.value, "_blank"));

  loadBtn.addEventListener("click", loadChat);
  channelInput.addEventListener("keypress", e => {
    if (e.key === "Enter") loadChat();
  });

  window.addEventListener("DOMContentLoaded", () => {
    const param = getUrlParams();
    if (param) {
      channelInput.value = param;
      loadChat();
    }
  });
</script>
