<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Chat en tiempo real — Kick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-panel: #111111;
      --text: #e5e7eb;
      --muted: #888;
      --font: "Baloo Tammudu 2", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 100vh;
      font-weight: 800;
    }

    #chat-section {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #channel-input-container {
      padding: 1rem;
      width: 100%;
      background: var(--bg-dark);
    }

    #chat {
      height: auto;
      overflow-y: auto;
      padding: 1rem;
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
      background: transparent;
      flex-grow: 1;
      font-size: 20px;
      display: flex;
      flex-direction: column;
    }

    #chat::-webkit-scrollbar { width: 0px; }

    .msg {
      margin-bottom: 0.3rem;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(2px 2px 0.2rem black);
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateY(5px);
      animation: fadeUp 0.3s ease forwards;
      line-height: 30px;
      display: block;
      word-wrap: break-word;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 0;
      flex-wrap: nowrap;
    }

    .badge-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 3px;
      margin-bottom: 2px;
      display: inline-block;
    }

    .user {
      font-weight: 800;
      font-size: 1em;
      display: inline;
      align-items: center;
      gap: 2px;
    }

    .username-text {
      display: inline-block;
      position: relative;
      line-height: inherit;
      vertical-align: baseline;
      background-size: 100%;
      background-repeat: no-repeat;
    }

    .username-text[data-7tv-overlay="true"]::after {
      content: attr(data-username);
      position: absolute;
      inset: 0;
      color: transparent;
      background-image: var(--seventv-paint-bg);
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: var(--seventv-paint-opacity, 0.48);
      text-shadow: none;
      filter: none;
      pointer-events: none;
    }
    
    .user::after {
      content: ': ';
    }

    .text {
      color: var(--text);
      line-height: 1.4;
      word-wrap: break-word;
      font-size: 1em;
      background: transparent;
      display: inline;
      margin-left: 5px;
    }

    /* ===================== EMOTES ===================== */
    .emote {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-third {
      height: 32px;
      width: auto;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-zero-width {
      position: absolute;
      margin-left: -32px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <section id="chat-section">
    <div id="channel-input-container">
      <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
        <input type="text" id="channel-name-input" placeholder="Nombre del canal (ej: elshark)" 
               style="flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: none; background: #222; color: #fff; font-size: 16px; font-family: var(--font);">
        <button id="load-chat-btn" 
                style="padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font);">
          Cargar Chat
        </button>
      </div>
      <div id="status-message" style="color: var(--muted); font-size: 14px; margin-bottom: 0.5rem;"></div>
      <div id="link-container" style="margin-top: 0.5rem; padding: 0.75rem; background: #1a1a1a; border-radius: 8px; display: none;">
        <label style="color: #53fc18; font-size: 14px; display: block; margin-bottom: 0.5rem; font-weight: 700;">🔗 Link para compartir:</label>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" id="generated-link" readonly
                 style="flex: 1; padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #0a0a0a; color: #53fc18; font-size: 13px; font-family: monospace;">
          <button id="copy-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 14px; cursor: pointer;">
            📋 Copiar
          </button>
          <button id="open-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 14px; font-weight: 700; cursor: pointer;">
            🚀 Abrir
          </button>
        </div>
      </div>
    </div>
    <div id="chat" style="display: none;"></div>
  </section>

<script>
  // Proxy CORS
  const CORS_PROXY = "https://api.allorigins.win/raw?url=";
  const CORS_PROXY_FALLBACK = "https://api.codetabs.com/v1/proxy?quest=";
  
  // WebSocket de Pusher
  const PUSHER_WS_URL = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=7.6.0&flash=false";
  
  let CHANNEL_ID = null;
  let CHATROOM_ID = null;
  let CHAT_URL = null;
  let currentChannel = null;
  let kickWS = null;
  const chatDiv = document.getElementById("chat");
  const inputContainer = document.getElementById("channel-input-container");
  const channelInput = document.getElementById("channel-name-input");
  const loadBtn = document.getElementById("load-chat-btn");
  const statusMsg = document.getElementById("status-message");
  const linkContainer = document.getElementById("link-container");
  const generatedLink = document.getElementById("generated-link");
  const copyLinkBtn = document.getElementById("copy-link-btn");
  const openLinkBtn = document.getElementById("open-link-btn");
  let messageIds = new Set();

  // ============ STORAGE ============
  let emotesData = {
    ffz: { global: {}, channel: {} },
    bttv: { global: {}, channel: {}, shared: {} },
    seventv: { global: {}, channel: {}, community: {} }
  };

  let subBadgesByMonths = {}; // "1", "2", "3", "6", "9", "12", "18", "24"

  const KICK_BADGES = {
    "moderator": "assets/mod.svg",
    "vip": "assets/vip.svg",
    "verified": "assets/verified.png",
    "broadcaster": "assets/broadcaster.png",
    "og": "assets/og.png",
    "subscriber": "assets/subscriber.png",
    "sub_gifter": "assets/sub_gifter.png",
    "founder": "assets/founder.png"
  };

  const KICK_USERNAME_COLORS = [
    "#00ff66", "#53fc18", "#00c7ff", "#0095ff", "#1da1f2", "#00aeef",
    "#2f80ed", "#5865f2", "#8b5cf6", "#a855f7", "#d946ef", "#ff4ecd",
    "#ff5c8a", "#ff3864", "#e9113c", "#ff6a4a", "#ff9500", "#ffc900",
    "#facc15", "#22c55e", "#14b8a6", "#06b6d4"
  ];

  const KICK_USERNAME_OVERRIDES = {
    "collin_0108": "#00aeef",
    "txc_matheo": "#c65cff",
    "fabian_rms": "#ff3864"
  };

  const ENABLE_7TV_NAME_PAINTS = new URLSearchParams(window.location.search).get("paints") !== "off";

  const KICK_USERNAME_COLOR_NAMES = {
    green: "#00ff66",
    kick: "#53fc18",
    lime: "#53fc18",
    cyan: "#00c7ff",
    aqua: "#00c7ff",
    sky: "#00aeef",
    blue: "#0095ff",
    royal: "#2f80ed",
    indigo: "#5865f2",
    purple: "#8b5cf6",
    violet: "#a855f7",
    magenta: "#d946ef",
    pink: "#ff4ecd",
    rose: "#ff5c8a",
    red: "#e9113c",
    coral: "#ff6a4a",
    orange: "#ff9500",
    gold: "#ffc900",
    yellow: "#facc15",
    teal: "#14b8a6"
  };

  const STREAMER_CUSTOM_7TV_SETS = {
    "carlogato": ["01HTTD778R000E3Y75DEQDXPKB"],
    "elshark": ["01KKFNJR4WRG7W82S12R3W1TWW"],
    "elviejoesteban": ["01JPCFHR3A28YZR5VA53J8W2MJ"],
  };

  // ============ FETCH HELPERS ============
  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return params.get("channel");
  }

  function generateLink(channelName) {
    const baseUrl = window.location.href.split("?")[0];
    return `${baseUrl}?channel=${encodeURIComponent(channelName)}`;
  }

  async function fetchDirect(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      throw err;
    }
  }

  async function fetchWithProxy(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const proxyUrl = CORS_PROXY + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      try {
        const fallbackUrl = CORS_PROXY_FALLBACK + encodeURIComponent(url);
        const res2 = await fetch(fallbackUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeoutId);
        return await res2.json();
      } catch (err2) {
        clearTimeout(timeoutId);
        throw err2;
      }
    }
  }

  async function raceFetch(url) {
    return Promise.race([fetchDirect(url).catch(() => null), fetchWithProxy(url).catch(() => null)]).then(r => r || fetchWithProxy(url));
  }

  const smartFetch = raceFetch;

  // ============ CARGAR BADGES DE SUSCRIPTOR ============
  async function loadChannelSubBadges(channelSlug) {
    try {
      const data = await smartFetch(`https://kick.com/api/v2/channels/${channelSlug}/info`);

      subBadgesByMonths = {};

      if (data?.subscriber_badges && Array.isArray(data.subscriber_badges)) {
        data.subscriber_badges.forEach(badge => {
          const monthsKey = String(badge.months || badge.level || 1);
          let badgeUrl = badge.badge_image?.src
                      || badge.badge_image?.original
                      || badge.image_url
                      || badge.url;

          if (badgeUrl) {
            if (!badgeUrl.startsWith('http')) badgeUrl = `https:${badgeUrl}`;
            subBadgesByMonths[monthsKey] = badgeUrl;
          }
        });
      }

      // Fallback v1 si v2 falla
      if (Object.keys(subBadgesByMonths).length === 0) {
        const fallbackData = await smartFetch(`https://kick.com/api/v1/channels/${channelSlug}`);
        if (fallbackData?.subscriber_badges) {
          fallbackData.subscriber_badges.forEach(tier => {
            const monthsKey = String(tier.months || tier.level || 1);
            const badgeUrl = tier.image_url || tier.badge?.src || tier.badge_image?.src || tier.url;
            if (monthsKey && badgeUrl) {
              subBadgesByMonths[monthsKey] = badgeUrl.startsWith('http') ? badgeUrl : `https:${badgeUrl}`;
            }
          });
        }
      }

      if (Object.keys(subBadgesByMonths).length > 0) {
        const meses = Object.keys(subBadgesByMonths).sort((a,b)=>Number(a)-Number(b)).join(', ');
        statusMsg.textContent += ` | ${Object.keys(subBadgesByMonths).length} sub-badges (meses: ${meses})`;
        console.log("Sub-badges cargados:", subBadgesByMonths);
      } else {
        statusMsg.textContent += " | No sub-badges personalizados";
      }
    } catch (err) {
      console.error("Error sub-badges:", err);
      statusMsg.textContent += " | Error al cargar sub-badges";
    }
  }

  // ============ LÓGICA DE TIERS (según tu observación) ============
  function getSubBadgeKey(months) {
    const m = Number(months) || 1;

    if (m <= 3) return String(m);      // 1, 2, 3 → usa su propio badge
    if (m <= 5) return "3";            // 4, 5 → usa el de 3
    if (m <= 8) return "6";            // 6, 7, 8 → usa el de 6
    if (m <= 11) return "9";           // 9,10,11 → usa el de 9
    if (m <= 17) return "12";          // 12–17 → usa el de 12
    if (m <= 23) return "18";          // 18–23 → usa el de 18
    return "24";                       // 24+ → usa el de 24
  }

  // ============ GENERATE BADGES ============
  function generateBadges(m, cosmetics) {
    let html = "";
    const kickBadges = m.identity?.badges || m.sender?.identity?.badges || [];

    kickBadges.forEach(b => {
      const tipo = (b.type || "").toLowerCase();

      if (tipo === "subscriber") {
        const monthsRaw = b.months || b.count || b.level || b.duration || 1;
        const key = getSubBadgeKey(monthsRaw);

        let badgeUrl = subBadgesByMonths[key];

        // Fallback si falta el tier exacto
        if (!badgeUrl) {
          const orden = ["24","18","12","9","6","3","2","1"];
          for (const k of orden) {
            if (subBadgesByMonths[k]) {
              badgeUrl = subBadgesByMonths[k];
              break;
            }
          }
        }

        // Último fallback genérico
        if (!badgeUrl) {
          badgeUrl = "https://files.kick.com/channel_subscriber_badges/754874/original";
        }

        html += `<img src="${badgeUrl}" alt="Suscriptor ${monthsRaw} meses" class="badge-icon" title="Suscriptor ${monthsRaw} meses (tier ${key})">`;
      } else {
        const icon = KICK_BADGES[tipo];
        if (icon) {
          html += `<img src="${icon}" alt="${tipo}" title="${b.text || tipo}" class="badge-icon">`;
        }
      }
    });

    // 7TV badges
    if (cosmetics?.badges?.length) {
      cosmetics.badges.forEach(b => {
        const url = get7TVAssetUrl(b);
        if (url) {
          const title = escapeHTML(b.tooltip || b.name || '7TV');
          html += `<img src="${url}" alt="${title}" title="${title}" class="badge-icon">`;
        }
      });
    }

    return html;
  }

  // ============ Resto del código (sin cambios importantes) ============

  let seventvUserCache = {};
  let seventvGlobalPaintsPromise = null;
  let seventvPaintUsersById = {};
  const injected7TVPaintClasses = new Set();
  const injected7TVPaintOverlays = {};

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function to7TVColor(value, fallback = null) {
    if (value === undefined || value === null) return fallback;
    if (typeof value === "object") {
      if (Number.isFinite(value.r) && Number.isFinite(value.g) && Number.isFinite(value.b)) {
        const alpha = Number.isFinite(value.a) ? Math.max(0, Math.min(1, value.a / 255)) : 1;
        return `rgba(${value.r}, ${value.g}, ${value.b}, ${alpha})`;
      }
      if (value.hex) return to7TVColor(value.hex, fallback);
    }
    if (typeof value === "number") return `#${value.toString(16).padStart(6, "0").slice(-6)}`;
    if (typeof value === "string") {
      const hex = value.startsWith("#") ? value.slice(1) : value;
      if (/^[0-9a-f]{8}$/i.test(hex)) {
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        const a = parseInt(hex.slice(6, 8), 16) / 255;
        return `rgba(${r}, ${g}, ${b}, ${a})`;
      }
      if (/^#[0-9a-f]{3,6}$/i.test(value)) return value;
      if (/^[0-9a-f]{6}$/i.test(value)) return `#${value}`;
      if (/^\d+$/.test(value)) return to7TVColor(Number(value), fallback);
      if (/^(rgb|hsl)a?\(/i.test(value)) return value;
    }
    return fallback;
  }

  function pickByUsername(username, options) {
    const text = String(username || "");
    let hash = 0;
    for (let i = 0; i < text.length; i++) {
      hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
    }
    return options[Math.abs(hash) % options.length];
  }

  function normalizeKickUsernameColor(value, fallback = null) {
    if (typeof value === "string") {
      const namedColor = KICK_USERNAME_COLOR_NAMES[value.trim().toLowerCase()];
      if (namedColor) return namedColor;
    }
    return to7TVColor(value, fallback);
  }

  function getKickUsernameColor(m) {
    const identity = m.identity || m.sender?.identity || {};
    const sender = m.sender || {};
    const normalizedUsername = sender.username?.toLowerCase();

    if (normalizedUsername && KICK_USERNAME_OVERRIDES[normalizedUsername]) {
      return KICK_USERNAME_OVERRIDES[normalizedUsername];
    }

    const colorCandidates = [
      identity.color,
      identity.colour,
      identity.name_color,
      identity.nameColour,
      identity.nameColor,
      identity.username_color,
      identity.usernameColour,
      identity.usernameColor,
      identity.chat_color,
      identity.chatColour,
      identity.chatColor,
      sender.color,
      sender.colour,
      sender.name_color,
      sender.nameColour,
      sender.nameColor,
      sender.username_color,
      sender.usernameColour,
      sender.usernameColor,
      sender.chat_color,
      sender.chatColour,
      sender.chatColor
    ];

    for (const value of colorCandidates) {
      const color = normalizeKickUsernameColor(value, null);
      if (color) return color;
    }

    return pickByUsername(sender.username, KICK_USERNAME_COLORS);
  }

  function normalize7TVUrl(url) {
    if (!url) return "";
    if (url.startsWith("http")) return url;
    if (url.startsWith("//")) return `https:${url}`;
    if (url.startsWith("/")) return `https://cdn.7tv.app${url}`;
    return url;
  }

  function get7TVPaintClassName(paintId) {
    return `seventv-paint-${String(paintId || "").replace(/[^a-z0-9_-]/gi, "-")}`;
  }

  function get7TVPaintStyleSheet() {
    let styleEl = document.getElementById("seventv-paint-styles");
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.id = "seventv-paint-styles";
      document.head.appendChild(styleEl);
    }
    return styleEl;
  }

  function get7TVAssetUrl(asset) {
    if (asset?.images?.length) {
      return normalize7TVUrl(
        asset.images.find(img => img.mime === "image/webp" && img.scale >= 2)?.url
        || asset.images.find(img => img.mime === "image/webp")?.url
        || asset.images.find(img => img.scale >= 2)?.url
        || asset.images[0]?.url
      );
    }

    const directUrl = asset?.url || asset?.image_url || asset?.icon_url;
    if (directUrl) return normalize7TVUrl(directUrl);

    const host = asset?.host || asset?.data?.host;
    const files = host?.files || [];
    const file = files.find(f => f.format === "WEBP" && /(?:2x|3x|4x)/i.test(f.name))
              || files.find(f => f.format === "WEBP")
              || files[0];

    if (host?.url && file?.name) return normalize7TVUrl(`${host.url}/${file.name}`);
    return "";
  }

  function get7TVPaintImageUrl(asset) {
    const images = asset?.images || asset?.image?.images || [];
    if (images.length) {
      return normalize7TVUrl(
        images.find(img => img.mime === "image/webp" && img.scale >= 4 && !img.url.includes("_static"))?.url
        || images.find(img => img.mime === "image/webp" && !img.url.includes("_static"))?.url
        || images.find(img => img.mime === "image/gif" && img.scale >= 4)?.url
        || images.find(img => img.mime === "image/gif")?.url
        || images.find(img => img.scale >= 4 && !img.url.includes("_static"))?.url
        || images.find(img => !img.url.includes("_static"))?.url
        || images.find(img => img.mime === "image/webp" && img.scale >= 4)?.url
        || images.find(img => img.mime === "image/webp")?.url
        || images[0]?.url
      );
    }

    return get7TVAssetUrl(asset);
  }

  function get7TVPaintLayers(paint) {
    const layers = paint?.data?.layers || paint?.layers || [];
    if (Array.isArray(layers) && layers.length) return layers;

    if (paint?.gradients?.length) {
      return paint.gradients.map(gradient => ({ gradient }));
    }

    return [];
  }

  function collect7TVPaintUserIds(paint) {
    return [
      ...(paint?.user_ids || []),
      ...(paint?.userIds || []),
      ...(paint?.users || []).map(user => user?.id || user?.user_id || user?.userId)
    ].filter(Boolean).map(String);
  }

  function pickActive7TVPaint(user) {
    const style = user?.style || {};
    const cosmetics = user?.cosmetics || [];
    const activePaintId = style.active_paint_id || style.paint_id || style.paint?.id || style.activePaint?.id;

    return style.activePaint
        || style.active_paint
        || style.paint
        || style.paints?.find(p => p.active)
        || style.paints?.[0]
        || cosmetics.find(c => c.kind === "PAINT" && c.id === activePaintId)?.data
        || cosmetics.find(c => c.type === "PAINT" && c.id === activePaintId)?.data
        || cosmetics.find(c => c.id === activePaintId)
        || null;
  }

  function pickActive7TVBadges(user) {
    const style = user?.style || {};
    const cosmetics = user?.cosmetics || [];
    const activeBadgeIds = [
      style.active_badge_id,
      style.badge_id,
      ...(style.active_badge_ids || []),
      ...(style.badge_ids || [])
    ].filter(Boolean);

    const styleBadges = style.activeBadges
                   || style.active_badges
                   || style.badges
                   || [];

    if (styleBadges.length) return styleBadges;
    if (!activeBadgeIds.length) return [];

    return cosmetics
      .filter(c => activeBadgeIds.includes(c.id) || activeBadgeIds.includes(c.badge_id))
      .map(c => c.data || c);
  }

  async function fetch7TVGraphQL(query, variables) {
    const endpoints = location.protocol.startsWith("http")
      ? ["/api/7tv/gql", "https://7tv.io/v4/gql"]
      : ["https://7tv.io/v4/gql"];

    let lastError = null;

    for (const endpoint of endpoints) {
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ query, variables }),
          cache: "no-store"
        });

        if (!res.ok) throw new Error(`7TV GraphQL ${res.status}`);
        const json = await res.json();
        if (json.errors?.length) throw new Error(json.errors[0].message || "7TV GraphQL error");
        return json.data;
      } catch (err) {
        lastError = err;
      }
    }

    throw lastError || new Error("7TV GraphQL error");
  }

  async function fetch7TVV3GraphQL(query, variables = {}) {
    const res = await fetch("https://7tv.io/v3/gql", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query, variables }),
      cache: "no-store"
    });

    if (!res.ok) throw new Error(`7TV v3 GraphQL ${res.status}`);
    const json = await res.json();
    if (json.errors?.length) throw new Error(json.errors[0].message || "7TV v3 GraphQL error");
    return json.data;
  }

  const SEVENTV_GLOBAL_PAINTS_QUERY = `
    query {
      cosmetics {
        paints {
          id
          name
          color
          gradients {
            function
            canvas_repeat
            canvas_size
            at
            stops { at color }
            image_url
            shape
            angle
            repeat
          }
          shadows { x_offset y_offset radius color }
          text {
            weight
            transform
            variant
            shadows { x_offset y_offset radius color }
          }
        }
      }
    }
  `;

  async function fetch7TVGlobalPaints() {
    if (!seventvGlobalPaintsPromise) {
      seventvGlobalPaintsPromise = fetch7TVV3GraphQL(SEVENTV_GLOBAL_PAINTS_QUERY)
        .then(data => {
          const paints = data?.cosmetics?.paints || [];
          seventvPaintUsersById = {};
          paints.forEach(paint => {
            collect7TVPaintUserIds(paint).forEach(userId => {
              seventvPaintUsersById[userId] = paint.id;
            });
          });
          return Object.fromEntries(paints.map(p => [p.id, p]));
        })
        .catch(err => {
          seventvGlobalPaintsPromise = null;
          throw err;
        });
    }

    return seventvGlobalPaintsPromise;
  }

  async function enrich7TVPaintFromGlobal(paint) {
    if (!paint?.id) return paint || null;

    try {
      const paintsById = await fetch7TVGlobalPaints();
      const globalPaint = paintsById[paint.id];
      return globalPaint ? { ...paint, ...globalPaint } : paint;
    } catch (err) {
      console.warn("7TV global paints failed:", err);
      return paint;
    }
  }

  const SEVENTV_USER_STYLE_QUERY = `
    query($platformId: String!, $username: String!) {
      byConnection: users {
        userByConnection(platform: KICK, platformId: $platformId) {
          id
          mainConnection { platform platformId platformUsername }
          style {
            activePaint {
              id name
              data {
                layers {
                  id opacity
                  ty {
                    __typename
                    ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                    ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                    ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                    ... on PaintLayerTypeImage { images { url scale mime } }
                  }
                }
                shadows { color { hex r g b a } offsetX offsetY blur }
              }
            }
            activeBadge { id name images { url scale mime } }
          }
        }
      }
      bySearch: users {
        search(query: $username, page: 1, perPage: 5) {
          items {
            id
            mainConnection { platform platformId platformUsername }
            style {
              activePaint {
                id name
                data {
                  layers {
                    id opacity
                    ty {
                      __typename
                      ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                      ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeImage { images { url scale mime } }
                    }
                  }
                  shadows { color { hex r g b a } offsetX offsetY blur }
                }
              }
              activeBadge { id name images { url scale mime } }
            }
          }
        }
      }
    }
  `;

  function normalize7TVGraphQLUser(data, kickUserId, username) {
    const exact = data?.byConnection?.userByConnection;
    const items = data?.bySearch?.search?.items || [];
    const normalizedUsername = username?.toLowerCase();
    const hasCosmetics = user => !!(user?.style?.activePaint || user?.style?.activeBadge);

    const searched = items.find(item => {
      const connection = item.mainConnection || {};
      return connection.platform === "KICK"
          && (!kickUserId || connection.platformId === String(kickUserId))
          && (!normalizedUsername || connection.platformUsername?.toLowerCase() === normalizedUsername);
    }) || items.find(item => item.mainConnection?.platformUsername?.toLowerCase() === normalizedUsername)
       || items.find(item => item.mainConnection?.platform === "KICK")
       || items[0];

    const user = hasCosmetics(searched) ? searched : (exact || searched);
    if (!user) return null;

    return {
      paint: user.style?.activePaint || null,
      badges: user.style?.activeBadge ? [user.style.activeBadge] : []
    };
  }

  async function fetch7TVUserCosmetics(kickUserId, username = "") {
    const cacheKey = kickUserId || username?.toLowerCase();
    if (!cacheKey || seventvUserCache[cacheKey] !== undefined) return seventvUserCache[cacheKey];

    if (username) {
      try {
        const data = await fetch7TVGraphQL(SEVENTV_USER_STYLE_QUERY, {
          platformId: String(kickUserId || ""),
          username
        });
        const cosmetics = normalize7TVGraphQLUser(data, kickUserId, username);
        if (cosmetics?.paint || cosmetics?.badges?.length) {
          cosmetics.paint = await enrich7TVPaintFromGlobal(cosmetics.paint);
          seventvUserCache[cacheKey] = cosmetics;
          return cosmetics;
        }
      } catch (err) {
        console.warn("7TV v4 fallback failed:", username, err);
      }
    }

    try {
      const data = await smartFetch(`https://7tv.io/v3/users/kick/${kickUserId}`);
      if (!data?.user) {
        throw new Error("7TV v3 user not found");
      }
      const cosmetics = {
        paint: pickActive7TVPaint(data.user),
        badges: pickActive7TVBadges(data.user)
      };
      cosmetics.paint = await enrich7TVPaintFromGlobal(cosmetics.paint);
      seventvUserCache[cacheKey] = cosmetics;
      return cosmetics;
    } catch {
      seventvUserCache[cacheKey] = null;
      return null;
    }
  }

  async function loadFFZData() {
    try {
      const data = await raceFetch("https://api.frankerfacez.com/v1/set/global");
      if (data.sets) {
        Object.values(data.sets).forEach(set => {
          set.emoticons.forEach(e => {
            emotesData.ffz.global[e.name] = {
              url: `https://cdn.frankerfacez.com/emote/${e.id}/2`,
              url2x: `https://cdn.frankerfacez.com/emote/${e.id}/4`
            };
          });
        });
      }
    } catch {}
  }

  async function loadBTTVData() {
    try {
      const data = await smartFetch("https://api.betterttv.net/3/cached/emotes/global");
      data.forEach(e => {
        emotesData.bttv.global[e.code] = {
          url: `https://cdn.betterttv.net/emote/${e.id}/2x`,
          url2x: `https://cdn.betterttv.net/emote/${e.id}/3x`
        };
      });
    } catch {}
  }

  async function load7TVData() {
    try {
      const data = await smartFetch("https://7tv.io/v3/emote-sets/global");
      data.emotes?.forEach(e => {
        const host = e.data.host;
        const file = host.files.find(f => f.format === 'WEBP') || host.files[0];
        if (file) {
          emotesData.seventv.global[e.name] = {
            url: `https:${host.url}/${file.name}`,
            url2x: `https:${host.url}/${host.files[1]?.name || file.name}`
          };
        }
      });
    } catch {}
  }

  async function loadChannelCustom7TVSets(channelSlug) {
    const setIds = STREAMER_CUSTOM_7TV_SETS[channelSlug?.toLowerCase()] || [];
    if (!setIds.length) return;

    for (const setId of setIds) {
      try {
        const data = await smartFetch(`https://7tv.io/v3/emote-sets/${setId}`);
        data.emotes?.forEach(e => {
          const host = e.data.host;
          const file = host.files.find(f => f.format === 'WEBP') || host.files[0];
          if (file) {
            emotesData.seventv.community[e.name] = {
              url: `https:${host.url}/${file.name}`,
              url2x: `https:${host.url}/${host.files[1]?.name || file.name}`
            };
          }
        });
      } catch {}
    }
  }

  async function loadAllThirdPartyData(channelSlug) {
    statusMsg.textContent = "Cargando emotes...";
    await Promise.all([
      loadChannelCustom7TVSets(channelSlug),
      loadFFZData(),
      loadBTTVData(),
      load7TVData()
    ]);
  }

  function processEmotes(text) {
    if (!text) return "";
    let result = text;

    // Kick native emotes
    result = result.replace(/\[emote:(\d+):([^\]]+)\]/g, (_, id) => 
      `<img src="https://files.kick.com/emotes/${id}/fullsize" class="emote">`
    );

    // 7TV community → global → bttv → ffz (orden de prioridad inverso al largo)
    [
      ...Object.entries(emotesData.seventv.community),
      ...Object.entries(emotesData.seventv.global),
      ...Object.entries(emotesData.bttv.global),
      ...Object.entries(emotesData.ffz.global)
    ]
    .sort((a,b) => b[0].length - a[0].length)
    .forEach(([code, emote]) => {
      const escaped = code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      result = result.replace(
        new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g'),
        `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" class="emote-third" alt="${code}" title="${code}">`
      );
    });

    return result;
  }

  function build7TVShadowStyles(shadowsData) {
    const shadows = (shadowsData || [])
      .map(s => {
        const color = to7TVColor(s.color, "rgba(0,0,0,.85)");
        const x = s.x_offset ?? s.offsetX ?? 0;
        const y = s.y_offset ?? s.offsetY ?? 0;
        const blur = s.radius ?? s.blur ?? 0;
        return { x, y, blur, color };
      });

    if (!shadows.length) return "";

    const textShadow = shadows
      .map(s => `${s.x}px ${s.y}px ${s.blur}px ${s.color}`)
      .join(", ");
    const filterShadow = shadows
      .map(s => `drop-shadow(${s.x}px ${s.y}px ${s.blur}px ${s.color})`)
      .join(" ");

    return ` text-shadow: ${textShadow}; filter: ${filterShadow};`;
  }

  function build7TVTextShadowStyle(shadowsData) {
    const textShadow = (shadowsData || [])
      .map(s => {
        const color = to7TVColor(s.color, "rgba(0,0,0,.85)");
        const x = s.x_offset ?? s.offsetX ?? 0;
        const y = s.y_offset ?? s.offsetY ?? 0;
        const blur = s.radius ?? s.blur ?? 0;
        return `${x}px ${y}px ${blur}px ${color}`;
      })
      .filter(Boolean)
      .join(", ");

    return textShadow ? ` text-shadow: ${textShadow};` : "";
  }

  function build7TVPaintBackgroundLayers(paint, base) {
    const backgroundLayers = [];
    const solidColors = [];

    get7TVPaintLayers(paint).forEach(layer => {
      const ty = layer.ty || layer.image || {};
      const gradient = layer.gradient || layer.linearGradient || layer.radialGradient || ty;

      if (ty.__typename === "PaintLayerTypeSingleColor" && ty.color) {
        solidColors.push(to7TVColor(ty.color, base));
        return;
      }

      if ((ty.__typename === "PaintLayerTypeLinearGradient" || ty.__typename === "PaintLayerTypeRadialGradient") && ty.stops?.length) {
        const stops = ty.stops
          .map(s => `${to7TVColor(s.color, base)} ${Math.max(0, Math.min(1, Number(s.at || 0))) * 100}%`)
          .join(", ");
        backgroundLayers.push(
          ty.__typename === "PaintLayerTypeRadialGradient"
            ? `radial-gradient(circle, ${stops})`
            : `linear-gradient(${ty.angle || 90}deg, ${stops})`
        );
        return;
      }

      const imageUrl = get7TVPaintImageUrl(ty) || get7TVPaintImageUrl(layer);
      if (imageUrl) {
        backgroundLayers.push(`url("${imageUrl}")`);
        return;
      }

      const gradientFunction = String(gradient.function || "").toUpperCase();
      const gradientImageUrl = normalize7TVUrl(gradient.image_url || "");
      if (gradientImageUrl && gradientFunction.includes("URL")) {
        backgroundLayers.push(`url("${gradientImageUrl}")`);
        return;
      }

      const stops = (gradient.stops || [])
        .map(s => {
          const color = to7TVColor(s.color, base);
          const rawAt = Number(s.at ?? 0);
          const at = Math.max(0, Math.min(1, rawAt > 1 ? rawAt / 100 : rawAt));
          return `${color} ${at * 100}%`;
        })
        .join(", ");

      if (stops) {
        backgroundLayers.push(
          gradientFunction.includes("RADIAL")
            ? `radial-gradient(${gradient.shape || "circle"}, ${stops})`
            : `linear-gradient(${gradient.angle || 90}deg, ${stops})`
        );
      }
    });

    return {
      backgroundLayers,
      solidColor: solidColors.find(Boolean) || to7TVColor(paint?.color, null)
    };
  }

  function ensure7TVPaintClass(paint, base) {
    if (!paint?.id) return "";

    const className = get7TVPaintClassName(paint.id);
    if (injected7TVPaintClasses.has(className)) {
      return { className, hasOverlay: !!injected7TVPaintOverlays[className] };
    }

    const { backgroundLayers, solidColor } = build7TVPaintBackgroundLayers(paint, base);
    const shadowsData = [
      ...(paint.shadows || []),
      ...(paint.text?.shadows || []),
      ...(!paint.shadows?.length && !paint.text?.shadows?.length ? (paint.data?.shadows || []) : [])
    ];
    const hasImageLayer = backgroundLayers.some(layer => layer.startsWith("url("));
    const shadowStyles = hasImageLayer ? "" : build7TVShadowStyles(shadowsData);
    const color = solidColor || "var(--kick-name-color)";
    const declarations = hasImageLayer
      ? `color: ${color}; --seventv-paint-bg: ${backgroundLayers.join(", ")}; --seventv-paint-opacity: 0.62;${shadowStyles}`
      : backgroundLayers.length
        ? `color: ${color}; background-image: ${backgroundLayers.join(", ")}; background-color: currentColor; background-size: cover; background-position: center; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; -webkit-text-stroke: 0px;${shadowStyles}`
        : `color: ${color};${shadowStyles}`;

    get7TVPaintStyleSheet().appendChild(document.createTextNode(`.${className}{${declarations}}\n`));
    injected7TVPaintClasses.add(className);
    injected7TVPaintOverlays[className] = hasImageLayer;
    return { className, hasOverlay: hasImageLayer };
  }

  function generateNamePaint(m, cosmetics) {
    const base = getKickUsernameColor(m);
    const style = `--kick-name-color: ${base}; color: ${base};`;
    const paintClass = ENABLE_7TV_NAME_PAINTS ? ensure7TVPaintClass(cosmetics?.paint, base) : null;
    return {
      style,
      className: paintClass?.className || "",
      hasOverlay: !!paintClass?.hasOverlay
    };
  }

  async function addMessage(m) {
    if (messageIds.has(m.id)) return;
    messageIds.add(m.id);

    const username = m.sender?.username || "Anónimo";
    const kickUserId = m.sender?.id || "";

    const cosmetics = await fetch7TVUserCosmetics(kickUserId, username);

    const badgesHTML = generateBadges(m, cosmetics);
    const namePaint = generateNamePaint(m, cosmetics);
    const paintName = cosmetics?.paint?.name || "";
    const badgeNames = cosmetics?.badges?.map(b => b.name || b.tooltip).filter(Boolean).join(", ") || "";
    const cosmeticsTitle = [paintName && `7TV paint: ${paintName}`, badgeNames && `7TV badge: ${badgeNames}`].filter(Boolean).join(" | ");
    const content = processEmotes(m.content);

    const msg = document.createElement("div");
    msg.className = "msg";
    msg.innerHTML = `
      <span class="meta">
        <span class="user">${badgesHTML}<span class="username-text ${escapeHTML(namePaint.className)}" data-username="${escapeHTML(username)}" data-7tv-overlay="${namePaint.hasOverlay ? "true" : "false"}" data-7tv-paint="${escapeHTML(paintName)}" title="${escapeHTML(cosmeticsTitle)}" style="${namePaint.style}">${escapeHTML(username)}</span></span>
      </span>
      <span class="text">${content}</span>
    `;

    chatDiv.appendChild(msg);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  async function getChannelId(channelSlug) {
    statusMsg.textContent = "Obteniendo canal...";
    statusMsg.style.color = "#53fc18";
    try {
      const data = await smartFetch(`https://kick.com/api/v1/channels/${channelSlug}`);
      return {
        channelId: data.id,
        chatroomId: data.chatroom?.id,
        isLive: !!data.livestream?.id
      };
    } catch (err) {
      statusMsg.textContent = "Error: " + err.message;
      statusMsg.style.color = "#ff4444";
      throw err;
    }
  }

  async function loadChat() {
    const channelName = channelInput.value.trim().toLowerCase();
    if (!channelName) {
      statusMsg.textContent = "Ingresa un nombre de canal";
      statusMsg.style.color = "#ff4444";
      return;
    }

    try {
      const result = await getChannelId(channelName);
      CHANNEL_ID = result.channelId;
      CHATROOM_ID = result.chatroomId;
      currentChannel = channelName;
      CHAT_URL = `https://kick.com/api/v2/channels/${CHANNEL_ID}/messages`;

      await loadChannelSubBadges(channelName);
      await loadAllThirdPartyData(channelName);

      const isDirectLink = getUrlParams() !== null;
      if (isDirectLink) {
        inputContainer.style.display = "none";
        chatDiv.style.display = "flex";
      } else {
        statusMsg.textContent = result.isLive ? `🔴 EN VIVO: ${channelName}` : `⚫ OFFLINE: ${channelName}`;
        statusMsg.style.color = result.isLive ? "#53fc18" : "#ffaa00";
        generatedLink.value = generateLink(channelName);
        linkContainer.style.display = "block";
        channelInput.style.display = "none";
        loadBtn.style.display = "none";
        chatDiv.style.display = "flex";
      }

      chatDiv.innerHTML = "";
      messageIds.clear();

      connectWebSocket();
      fetchInitialMessages();
    } catch (err) {
      console.error(err);
    }
  }

  function connectWebSocket() {
    if (kickWS) kickWS.close();
    kickWS = new WebSocket(PUSHER_WS_URL);

    kickWS.addEventListener("open", () => {
      kickWS.send(JSON.stringify({
        event: "pusher:subscribe",
        data: { auth: "", channel: `chatrooms.${CHATROOM_ID}.v2` }
      }));
    });

    kickWS.addEventListener("message", (event) => {
      try {
        const parsed = JSON.parse(event.data);
        if (parsed.event === "App\\Events\\ChatMessageEvent") {
          const data = JSON.parse(parsed.data);
          addMessage({
            id: data.id,
            content: data.content,
            sender: data.sender,
            identity: data.sender.identity
          });
        }
      } catch {}
    });

    kickWS.addEventListener("error", () => setTimeout(connectWebSocket, 1500));
    kickWS.addEventListener("close", () => setTimeout(connectWebSocket, 1500));
  }

async function fetchInitialMessages() {
  if (!CHAT_URL) return;

  let url = CHAT_URL;
  let loaded = 0;
  const MAX_PAGES = 3;      // intenta hasta 3 páginas (ajusta según rate-limit)
  const MESSAGES_PER_PAGE = 100; // suposición

  for (let page = 0; page < MAX_PAGES; page++) {
    try {
      const data = await raceFetch(url);
      const msgs = data?.data?.messages || data?.messages || [];

      if (!msgs.length) break;

      msgs.reverse().forEach(m => {
        if (!messageIds.has(m.id)) {
          addMessage(m);
          loaded++;
        }
      });

      // Intento de paginación (cambia según lo que veas en Network tab)
      // Ejemplos probados por gente: ?before={last_id}  o  ?cursor={next_cursor}
      const lastMsg = msgs[msgs.length - 1];
      if (!lastMsg?.id) break;

      url = `${CHAT_URL}?before=${lastMsg.id}`;  // ← prueba este parámetro primero
      // Alternativas a probar si no funciona:
      // url = `${CHAT_URL}?cursor=${lastMsg.id}`;
      // url = `${CHAT_URL}?limit=100&before_id=${lastMsg.id}`;

      await new Promise(r => setTimeout(r, 800)); // delay anti-rate-limit
    } catch (e) {
      console.warn("Error en página de historial", page, e);
      break;
    }
  }

  console.log(`Cargados ${loaded} mensajes iniciales`);
  statusMsg.textContent += ` | ${loaded} mensajes históricos cargados`;
}

  // Eventos
  copyLinkBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(generatedLink.value);
    copyLinkBtn.textContent = "Copiado ✓";
    setTimeout(() => copyLinkBtn.textContent = "📋 Copiar", 1800);
  });

  openLinkBtn.addEventListener("click", () => window.open(generatedLink.value, "_blank"));

  loadBtn.addEventListener("click", loadChat);
  channelInput.addEventListener("keypress", e => {
    if (e.key === "Enter") loadChat();
  });

  window.addEventListener("DOMContentLoaded", () => {
    const param = getUrlParams();
    if (param) {
      channelInput.value = param;
      loadChat();
    }
  });
</script>
