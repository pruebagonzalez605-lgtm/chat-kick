<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Chat en tiempo real — Kick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-panel: #111111;
      --text: #e5e7eb;
      --muted: #888;
      --font: "Baloo Tammudu 2", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 100vh;
      font-weight: 800;
    }

    #chat-section {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #channel-input-container {
      padding: 1rem;
      width: 100%;
      background: var(--bg-dark);
    }

    #chat {
      height: auto;
      overflow-y: auto;
      padding: 1rem;
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
      background: transparent;
      flex-grow: 1;
      font-size: 20px;
      display: flex;
      flex-direction: column;
    }

    #chat::-webkit-scrollbar { width: 0px; }

    .msg {
      margin-bottom: 0.3rem; /* ← Aumentado para que los mensajes no queden tan pegados verticalmente */
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(2px 2px 0.2rem black);
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateY(5px);
      animation: fadeUp 0.3s ease forwards;
      line-height: 30px;
      display: block;
      word-wrap: break-word;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 0;
      flex-wrap: nowrap;
    }

    .badge-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 3px;
      margin-bottom: 2px;
      display: inline-block;
    }

    .user {
      font-weight: 800;
      font-size: 1em;
      display: inline;
      align-items: center;
      gap: 2px;
    }
    
    .user::after {
      content: ': ';
    }

    .text {
      color: var(--text);
      line-height: 1.4;
      word-wrap: break-word;
      font-size: 1em;
      background: transparent;
      display: inline;
      margin-left: 5px; /* ← ESPACIADO NUEVO: aquí separo el nombre del mensaje para que no quede pegado */
    }

    /* ===================== EMOTES ===================== */
    .emote {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-third {
      height: 32px;
      width: auto;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-zero-width {
      position: absolute;
      margin-left: -32px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <section id="chat-section">
    <div id="channel-input-container">
      <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
        <input type="text" id="channel-name-input" placeholder="Nombre del canal (ej: xqc)" 
               style="flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: none; background: #222; color: #fff; font-size: 16px; font-family: var(--font);">
        <button id="load-chat-btn" 
                style="padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font);">
          Cargar Chat
        </button>
      </div>
      <div id="status-message" style="color: var(--muted); font-size: 14px; margin-bottom: 0.5rem;"></div>
      <div id="link-container" style="margin-top: 0.5rem; padding: 0.75rem; background: #1a1a1a; border-radius: 8px; display: none;">
        <label style="color: #53fc18; font-size: 14px; display: block; margin-bottom: 0.5rem; font-weight: 700;">🔗 Link para compartir:</label>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" id="generated-link" readonly
                 style="flex: 1; padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #0a0a0a; color: #53fc18; font-size: 13px; font-family: monospace;">
          <button id="copy-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 14px; cursor: pointer;">
            📋 Copiar
          </button>
          <button id="open-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 14px; font-weight: 700; cursor: pointer;">
            🚀 Abrir
          </button>
        </div>
      </div>
    </div>
    <div id="chat" style="display: none;"></div>
  </section>

<script>
  // Proxy CORS
  const CORS_PROXY = "https://corsproxy.io/?";
  
  // WebSocket de Pusher
  const PUSHER_WS_URL = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=7.6.0&flash=false";
  
  let CHANNEL_ID = null;
  let CHATROOM_ID = null;
  let CHAT_URL = null;
  let currentChannel = null;
  let kickWS = null;
  const chatDiv = document.getElementById("chat");
  const inputContainer = document.getElementById("channel-input-container");
  const channelInput = document.getElementById("channel-name-input");
  const loadBtn = document.getElementById("load-chat-btn");
  const statusMsg = document.getElementById("status-message");
  const linkContainer = document.getElementById("link-container");
  const generatedLink = document.getElementById("generated-link");
  const copyLinkBtn = document.getElementById("copy-link-btn");
  const openLinkBtn = document.getElementById("open-link-btn");
  let messageIds = new Set();

  // ============ STORAGE ============
  let emotesData = {
    ffz: { global: {}, channel: {} },
    bttv: { global: {}, channel: {}, shared: {} },
    seventv: { global: {}, channel: {}, community: {} }
  };

  let badgesData = {
    ffz: {},
    bttv: {},
    seventv: {},
    chatterino: {},
    ffzap: {}
  };

  let namePaints = {};

  let seventvUserCache = {};

  const KICK_BADGES = {
    "moderator": "assets/mod.svg",
    "vip": "assets/vip.svg",
    "verified": "assets/verified.png",
    "broadcaster": "assets/broadcaster.png",
    "og": "assets/og.png",
    "subscriber": "assets/subscriber.png",
    "sub_gifter": "assets/sub_gifter.png",
    "founder": "assets/founder.png"
  };

  const STREAMER_CUSTOM_7TV_SETS = {
    "carlogato": ["01HTTD778R000E3Y75DEQDXPKB"],
    "elshark": ["01GSHNB3R8000CWYGY299P02K7"],
    "elviejoesteban": ["01JPCFHR3A28YZR5VA53J8W2MJ"],
  };

  // ============ FETCH HELPERS ============
  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return params.get("channel");
  }

  function generateLink(channelName) {
    const baseUrl = window.location.href.split("?")[0];
    return `${baseUrl}?channel=${encodeURIComponent(channelName)}`;
  }

  async function fetchDirect(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      throw err;
    }
  }

  async function fetchWithProxy(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const proxyUrl = CORS_PROXY + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      throw err;
    }
  }

  async function raceFetch(url) {
    return Promise.race([fetchDirect(url).catch(() => null), fetchWithProxy(url).catch(() => null)]).then(r => r || fetchWithProxy(url));
  }

  const smartFetch = raceFetch;

  // ============ FETCH 7TV USER COSMETICS ============
  async function fetch7TVUserCosmetics(kickUserId) {
    if (!kickUserId || seventvUserCache[kickUserId] !== undefined) return seventvUserCache[kickUserId];
    try {
      const data = await smartFetch(`https://7tv.io/v3/users/kick/${kickUserId}`);
      if (!data?.user) {
        seventvUserCache[kickUserId] = null;
        return null;
      }
      const u = data.user;
      const cosmetics = {
        paint: u.style?.paints?.[0] || null,
        badges: u.style?.badges || []
      };
      seventvUserCache[kickUserId] = cosmetics;
      return cosmetics;
    } catch (e) {
      seventvUserCache[kickUserId] = null;
      return null;
    }
  }

  // ============ LOAD EMOTES & BADGES ============
  async function loadFFZData() {
    try {
      const globalData = await raceFetch("https://api.frankerfacez.com/v1/set/global");
      if (globalData.sets) {
        Object.values(globalData.sets).forEach(set => {
          set.emoticons.forEach(emote => {
            emotesData.ffz.global[emote.name] = {
              id: emote.id,
              url: `https://cdn.frankerfacez.com/emote/${emote.id}/2`,
              url2x: `https://cdn.frankerfacez.com/emote/${emote.id}/4`,
              zero_width: emote.css?.includes('transform') || false
            };
          });
        });
      }
    } catch (e) {}
  }

  async function loadBTTVData() {
    try {
      const globalData = await smartFetch("https://api.betterttv.net/3/cached/emotes/global");
      globalData.forEach(emote => {
        emotesData.bttv.global[emote.code] = {
          id: emote.id,
          url: `https://cdn.betterttv.net/emote/${emote.id}/2x`,
          url2x: `https://cdn.betterttv.net/emote/${emote.id}/3x`,
          zero_width: emote.modifier || false
        };
      });
    } catch (e) {}
  }

  async function load7TVData() {
    try {
      const globalData = await smartFetch("https://7tv.io/v3/emote-sets/global");
      if (globalData.emotes) {
        globalData.emotes.forEach(emote => {
          const host = emote.data.host;
          const file = host.files.find(f => f.format === 'WEBP') || host.files[0];
          if (!file) return;
          const code = emote.name;
          if (emotesData.seventv.global[code]) return;
          emotesData.seventv.global[code] = {
            id: emote.id,
            url: `https:${host.url}/${file.name}`,
            url2x: `https:${host.url}/${host.files[1]?.name || file.name}`,
            zero_width: emote.data.flags === 1 || emote.data.flags === 3
          };
        });
      }
    } catch (e) {}
  }

  async function loadChannelCustom7TVSets(channelSlug) {
    emotesData.seventv.community = {};
    const setIds = STREAMER_CUSTOM_7TV_SETS[channelSlug?.toLowerCase()] || [];
    if (setIds.length === 0) return;

    statusMsg.textContent = `Cargando packs 7TV de ${channelSlug}...`;
    let totalLoaded = 0;

    for (const setId of setIds) {
      try {
        const data = await smartFetch(`https://7tv.io/v3/emote-sets/${setId}`);
        if (!data?.emotes?.length) continue;

        data.emotes.forEach(emote => {
          const host = emote.data.host;
          const file = host.files.find(f => f.format === 'WEBP') || host.files[0];
          if (!file) return;
          const code = emote.name;
          if (emotesData.seventv.global[code] || emotesData.seventv.channel[code]) return;

          emotesData.seventv.community[code] = {
            id: emote.id,
            url: `https:${host.url}/${file.name}`,
            url2x: `https:${host.url}/${host.files[1]?.name || file.name}`,
            zero_width: emote.data.flags === 1 || emote.data.flags === 3
          };
          totalLoaded++;
        });
      } catch (err) {}
    }
    if (totalLoaded > 0) statusMsg.textContent = `✅ ${totalLoaded} emotes 7TV de ${channelSlug} cargados`;
  }

  async function loadChatterinoBadges() {
    try {
      const data = await smartFetch("https://api.chatterino.com/badges");
      if (data.badges) {
        data.badges.forEach(badge => {
          badgesData.chatterino[badge.id] = { name: badge.tooltip, url: badge.image1, url2x: badge.image2 };
        });
      }
    } catch (e) {}
  }

  async function loadFFZAPBadges() {
    try {
      const data = await smartFetch("https://api-test.frankerfacez.com/badges");
      if (data.badges) {
        data.badges.forEach(badge => {
          badgesData.ffzap[badge.id] = { name: badge.name, url: badge.urls?.['2'] || badge.urls?.['1'] };
        });
      }
    } catch (e) {}
  }

  async function loadAllThirdPartyData(channelSlug = null) {
    statusMsg.textContent = "Cargando emotes y badges...";
    await Promise.all([
      loadChannelCustom7TVSets(channelSlug),
      loadFFZData(),
      loadBTTVData(),
      load7TVData(),
      loadChatterinoBadges(),
      loadFFZAPBadges()
    ]);
  }

  // ============ PROCESS EMOTES ============
  function processEmotes(text) {
    if (!text) return "";
    let result = text;

    result = result.replace(/\[emote:(\d+):([^\]]+)\]/g, (_, id, nombre) => {
      const clean = (nombre || 'emote').replace(/[<>"']/g, '');
      return `<img src="https://files.kick.com/emotes/${id}/fullsize" alt="${clean}" title="${clean}" class="emote">`;
    });

    const sortedCommunity = Object.entries(emotesData.seventv.community).sort((a,b) => b[0].length - a[0].length);
    sortedCommunity.forEach(([code, emote]) => {
      const escaped = escapeRegex(code);
      const regex = new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g');
      result = result.replace(regex, `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" alt="${code}" title="${code}" class="emote-third${emote.zero_width ? ' emote-zero-width' : ''}">`);
    });

    const sorted7tv = Object.entries(emotesData.seventv.global).sort((a,b) => b[0].length - a[0].length);
    sorted7tv.forEach(([code, emote]) => {
      const escaped = escapeRegex(code);
      const regex = new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g');
      result = result.replace(regex, `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" alt="${code}" title="${code}" class="emote-third${emote.zero_width ? ' emote-zero-width' : ''}">`);
    });

    const sortedBttv = Object.entries(emotesData.bttv.global).sort((a,b) => b[0].length - a[0].length);
    sortedBttv.forEach(([code, emote]) => {
      const escaped = escapeRegex(code);
      const regex = new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g');
      result = result.replace(regex, `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" alt="${code}" title="${code}" class="emote-third${emote.zero_width ? ' emote-zero-width' : ''}">`);
    });

    const sortedFfz = Object.entries(emotesData.ffz.global).sort((a,b) => b[0].length - a[0].length);
    sortedFfz.forEach(([code, emote]) => {
      const escaped = escapeRegex(code);
      const regex = new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g');
      result = result.replace(regex, `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" alt="${code}" title="${code}" class="emote-third${emote.zero_width ? ' emote-zero-width' : ''}">`);
    });

    return result;
  }

  function escapeRegex(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // ============ GENERATE BADGES y NAME PAINT ============
  function generateBadges(m, cosmetics) {
    let html = "";
    const kickBadges = m.identity?.badges || m.sender?.identity?.badges || [];
    kickBadges.forEach(b => {
      const tipo = b.type?.toLowerCase();
      const icon = KICK_BADGES[tipo];
      if (icon) html += `<img src="${icon}" alt="${tipo}" title="${b.text || tipo}" class="badge-icon">`;
    });

    if (cosmetics && cosmetics.badges && Array.isArray(cosmetics.badges)) {
      cosmetics.badges.forEach(b => {
        if (b.url) html += `<img src="${b.url}" alt="${b.tooltip || '7TV'}" title="${b.tooltip || '7TV Badge'}" class="badge-icon">`;
      });
    }
    return html;
  }

  function generateNamePaint(m, cosmetics) {
    const baseColor = m.identity?.color || m.sender?.identity?.color || "#00ff66";
    if (cosmetics && cosmetics.paint) {
      const p = cosmetics.paint;
      let style = "";
      if (p.gradient && p.gradient.stops) {
        const stops = p.gradient.stops.map(s => `${s.color} ${s.at * 100}%`).join(', ');
        style = `background: linear-gradient(${p.gradient.angle || 90}deg, ${stops}); -webkit-background-clip: text; -webkit-text-fill-color: transparent;`;
      } else if (p.color) {
        style = `color: ${p.color};`;
      }
      if (p.shadows && p.shadows.length) {
        const shadows = p.shadows.map(s => `drop-shadow(${s.x_offset || 0}px ${s.y_offset || 0}px ${s.radius || 0}px ${s.color})`).join(' ');
        style += ` filter: ${shadows};`;
      }
      return style || `color: ${baseColor};`;
    }
    return `color: ${baseColor};`;
  }

  // ============ ADD MESSAGE ============
  async function addMessage(m) {
    if (messageIds.has(m.id)) return;
    messageIds.add(m.id);

    const username = m.sender?.username || "Anónimo";
    const kickUserId = m.sender?.id || "";

    const cosmetics = kickUserId ? await fetch7TVUserCosmetics(kickUserId) : null;

    const badgesHTML = generateBadges(m, cosmetics);
    const nameStyle = generateNamePaint(m, cosmetics);
    const processedContent = processEmotes(m.content);

    const msg = document.createElement("div");
    msg.className = "msg";
    msg.id = m.id || "";
    msg.setAttribute("data-user-id", kickUserId);
    msg.innerHTML = `<span class="meta"><span class="user" style="${nameStyle}">${badgesHTML}${username}</span></span><span class="text">${processedContent}</span>`;
    
    chatDiv.appendChild(msg);
    chatDiv.scrollTop = chatDiv.scrollHeight;
  }

  // ============ MAIN FUNCTIONS ============
  async function getChannelId(channelSlug) {
    statusMsg.textContent = "Obteniendo información del canal...";
    statusMsg.style.color = "#53fc18";
    try {
      const data = await smartFetch(`https://kick.com/api/v1/channels/${channelSlug}`);
      return {
        channelId: data.id,
        chatroomId: data.chatroom?.id,
        isLive: !!data.livestream?.id
      };
    } catch (err) {
      statusMsg.textContent = "Error: " + err.message;
      statusMsg.style.color = "#ff4444";
      throw err;
    }
  }

  async function loadChat() {
    const channelName = channelInput.value.trim().toLowerCase();
    if (!channelName) {
      statusMsg.textContent = "Por favor ingresa un nombre de canal";
      statusMsg.style.color = "#ff4444";
      return;
    }

    try {
      const result = await getChannelId(channelName);
      CHANNEL_ID = result.channelId;
      CHATROOM_ID = result.chatroomId;
      currentChannel = channelName;
      CHAT_URL = `https://kick.com/api/v2/channels/${CHANNEL_ID}/messages`;

      await loadAllThirdPartyData(currentChannel);

      const isChatOnlyMode = getUrlParams() !== null;
      if (isChatOnlyMode) {
        inputContainer.style.display = "none";
        chatDiv.style.display = "flex";
      } else {
        statusMsg.textContent = result.isLive ? `🔴 EN VIVO: ${channelName}` : `⚫ OFFLINE: ${channelName}`;
        statusMsg.style.color = result.isLive ? "#53fc18" : "#ffaa00";
        const link = generateLink(channelName);
        generatedLink.value = link;
        linkContainer.style.display = "block";
        channelInput.style.display = "none";
        loadBtn.style.display = "none";
        chatDiv.style.display = "flex";
      }

      chatDiv.innerHTML = "";
      messageIds.clear();

      connectWebSocket();
      fetchInitialMessages();
    } catch (err) {
      console.error(err);
    }
  }

  function connectWebSocket() {
    if (kickWS) kickWS.close();
    kickWS = new WebSocket(PUSHER_WS_URL);

    kickWS.addEventListener("open", () => {
      kickWS.send(JSON.stringify({ event: "pusher:subscribe", data: { auth: "", channel: `chatrooms.${CHATROOM_ID}.v2` } }));
    });

    kickWS.addEventListener("message", (event) => {
      try {
        const msgData = JSON.parse(event.data);
        if (msgData.event === "App\\Events\\ChatMessageEvent") {
          const data = JSON.parse(msgData.data);
          const message = { id: data.id, content: data.content, sender: data.sender, identity: data.sender.identity };
          addMessage(message);
        }
      } catch (e) {}
    });

    kickWS.addEventListener("error", () => setTimeout(connectWebSocket, 1000));
    kickWS.addEventListener("close", () => setTimeout(connectWebSocket, 1000));
  }

  async function fetchInitialMessages() {
    if (!CHAT_URL) return;
    try {
      const data = await raceFetch(CHAT_URL);
      const messages = data?.data?.messages || data?.messages || [];
      messages.reverse().forEach(m => {
        if (!messageIds.has(m.id)) {
          messageIds.add(m.id);
          addMessage(m);
        }
      });
    } catch (e) {}
  }

  // ============ EVENT LISTENERS ============
  copyLinkBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(generatedLink.value);
    copyLinkBtn.textContent = "Copiado!";
    setTimeout(() => copyLinkBtn.textContent = "📋 Copiar", 2000);
  });

  openLinkBtn.addEventListener("click", () => window.open(generatedLink.value, "_blank"));

  loadBtn.addEventListener("click", loadChat);
  channelInput.addEventListener("keypress", e => { if (e.key === "Enter") loadChat(); });

  window.addEventListener("DOMContentLoaded", () => {
    const param = getUrlParams();
    if (param) {
      channelInput.value = param;
      loadChat();
    }
  });
</script>

</body>
</html>
