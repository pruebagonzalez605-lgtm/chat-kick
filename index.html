<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Chat en tiempo real — Kick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-panel: #111111;
      --text: #e5e7eb;
      --muted: #888;
      --font: "Baloo Tammudu 2", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 100vh;
      font-weight: 800;
    }

    #chat-section {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #channel-input-container {
      padding: 0.5rem;
      width: 100%;
      background: transparent;
    }

    #chat {
      height: auto;
      overflow-y: auto;
      padding: 0.4rem 0.5rem;
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
      background: transparent;
      flex-grow: 1;
      font-size: 16px; /* controlado por ResizeObserver */
      display: flex;
      flex-direction: column;
    }

    #chat::-webkit-scrollbar { width: 0px; }

    .msg {
      margin-bottom: 0.3rem;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(2px 2px 0.2rem black);
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateY(5px);
      animation: fadeUp 0.3s ease forwards;
      line-height: 30px;
      display: block;
      word-wrap: break-word;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 0;
      flex-wrap: nowrap;
    }

    .badge-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 3px;
      margin-bottom: 2px;
      display: inline-block;
    }

    .user {
      font-weight: 800;
      font-size: 1em;
      display: inline;
      align-items: center;
      gap: 2px;
    }

    /* colon via CSS ::after */
    .user::after {
      content: ': ';
    }

    .username-text {
      display: inline-block;
      position: relative;
      line-height: inherit;
      vertical-align: baseline;
    }

    /* Paint aplicado directo al elemento (mismo método que 7database) */
    .username-text[data-7tv-paint-direct="true"] {
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      background-size: cover;
      background-position: center center;
    }

    .text {
      color: var(--text);
      line-height: 1.4;
      word-wrap: break-word;
      font-size: 1em;
      background: transparent;
      display: inline;
      margin-left: 5px;
    }

    /* ===================== EMOTES ===================== */
    .emote {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-third {
      height: 32px;
      width: auto;
      vertical-align: middle;
      margin: 0 3px;
      border-radius: 6px;
      max-width: 75px;
      max-height: 32px;
      margin-right: -3px;
    }

    .emote-zero-width {
      position: absolute;
      margin-left: -32px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <section id="chat-section">
    <div id="channel-input-container">
      <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
        <input type="text" id="channel-name-input" placeholder="Nombre del canal (ej: elshark)" 
               style="flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: none; background: #222; color: #fff; font-size: 16px; font-family: var(--font);">
        <button id="load-chat-btn" 
                style="padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font);">
          Cargar Chat
        </button>
      </div>
      <div id="status-message" style="color: var(--muted); font-size: 14px; margin-bottom: 0.5rem;"></div>
      <div id="link-container" style="margin-top: 0.5rem; padding: 0.75rem; background: #1a1a1a; border-radius: 8px; display: none;">
        <label style="color: #53fc18; font-size: 14px; display: block; margin-bottom: 0.5rem; font-weight: 700;">🔗 Link para compartir:</label>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" id="generated-link" readonly
                 style="flex: 1; padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #0a0a0a; color: #53fc18; font-size: 13px; font-family: monospace;">
          <button id="copy-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #333; color: #fff; font-size: 14px; cursor: pointer;">
            📋 Copiar
          </button>
          <button id="open-link-btn" 
                  style="padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #53fc18; color: #000; font-size: 14px; font-weight: 700; cursor: pointer;">
            🚀 Abrir
          </button>
        </div>
      </div>
    </div>
    <div id="chat" style="display: none;"></div>
  </section>

<script>
  // Proxy CORS
  const CORS_PROXY = "https://api.allorigins.win/raw?url=";
  const CORS_PROXY_FALLBACK = "https://api.codetabs.com/v1/proxy?quest=";
  
  // WebSocket de Pusher
  const PUSHER_WS_URL = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=7.6.0&flash=false";
  
  let CHANNEL_ID = null;
  let CHATROOM_ID = null;
  let CHAT_URL = null;
  let STREAMER_USER_ID = null;
  let currentChannel = null;
  let kickWS = null;
  let sevenTVEventSource = null;
  const chatDiv = document.getElementById("chat");
  const inputContainer = document.getElementById("channel-input-container");
  const channelInput = document.getElementById("channel-name-input");
  const loadBtn = document.getElementById("load-chat-btn");
  const statusMsg = document.getElementById("status-message");
  const linkContainer = document.getElementById("link-container");
  const generatedLink = document.getElementById("generated-link");
  const copyLinkBtn = document.getElementById("copy-link-btn");
  const openLinkBtn = document.getElementById("open-link-btn");
  let messageIds = new Set();

  // ============ STORAGE ============
  let emotesData = {
    ffz: { global: {}, channel: {} },
    bttv: { global: {}, channel: {}, shared: {} },
    seventv: { global: {}, channel: {}, community: {} }
  };

  let subBadgesByMonths = {}; // "1", "2", "3", "6", "9", "12", "18", "24"

  const KICK_BADGES = {
    "moderator": "assets/mod.svg",
    "vip": "assets/vip.svg",
    "verified": "assets/verified.png",
    "broadcaster": "assets/broadcaster.png",
    "og": "assets/og.png",
    "subscriber": "assets/subscriber.png",
    "founder": "assets/founder.png",
    "staff": "assets/admin.svg",
    "flyby": "https://ext.cdn.kick.com/chat/badges/Flyby_019f123f-3354-7242-8e1d-6f608afacc92.png",
  };

  // SVG nativo real de Kick para el badge de "gifter" (regaló subs). El ícono
  // cambia de color según cuántas subs regaló, igual que hace Kick en el chat.
  //
  // IMPORTANTE: Kick usa VARIAS formas de ícono distintas según el tier:
  //   - Tiers 1, 5, 10, 25, 50            -> forma "corona" (caja con picos arriba, 3 paths + clipPath)
  //   - Tiers 100, 150, 200, 250, 300     -> forma "caja con listón vertical" (2 paths, sin clipPath)
  //   - Tiers 500, 700                    -> forma "caja alta" propia (3 paths)
  //   - Tier 1000                         -> forma "moño morado + brillos" propia
  //     todas confirmadas con SVGs reales que mandaste.
  //
  // Tiers reales de Kick (según las capturas + SVGs que mandaste):
  //   1    -> verde     (#53FC18 / #32970E)  [forma corona]
  //   5    -> turquesa  (#2EFAD1 / #00A18D)  [forma corona]
  //   10   -> morado    (#DEB2FF / #B664F6)  [forma corona]
  //   25   -> rosa      (#FBCFD8 / #E96E87)  [forma corona]
  //   50   -> dorado    (#FFD899 / #FF9D00)  [forma corona]
  //   100  -> verde     (#DDFED1 / #53FC18)  [forma caja+listón, confirmado]
  //   150  -> turquesa  (#93EBE0 / #00CCB3)  [forma caja+listón, confirmado]
  //   200  -> azul      (#B9D6F6 / #72ACED)  [forma caja+listón, confirmado]
  //   250  -> morado    (#DEB2FF / #BC66FF)  [forma caja+listón, confirmado]
  //   300  -> rosa      (#FBCFD8 / #F2708A)  [forma caja+listón, confirmado]
  //   400  -> verde/morado (#53FC18 / #BC66FF) [forma caja+listón, confirmado]
  //   500  -> verde     (#DDFED1 / #53FC18)  [forma propia "caja alta", confirmado con SVG real]
  //   700  -> rosa      (#FBCFD8 / #F2708A)  [forma propia "caja alta", confirmado con SVG real]
  //   900  -> rojo/turq (#F2708A / #E9113C + moño #31D6C2, sin brillos) [forma propia "bow", confirmado con SVG real]
  //   950  -> dorado/teal (#FFC466 / #FF9D00 + moño #00AD93, sin brillos) [forma propia "bow", confirmado con SVG real]
  //   1000 -> verde/morado (#53FC18 / #32970E + moño #BC66FF + brillos) [forma propia "sparkle", confirmado con SVG real]
  //   2000 -> turquesa/rosa (#00CCB3 / #00A18D + moño #F2708A + brillos) [forma propia "sparkle", confirmado con SVG real, umbral aproximado]
  //   3000 -> morado/azul  (#DEB2FF / #BC66FF + moño #1475E1 + brillos) [forma propia "sparkle", confirmado con SVG real, umbral aproximado]
  //   4000 -> rojo/verde   (#F2708A / #E9113C + moño #53FC18 + brillos) [forma propia "sparkle", confirmado con SVG real, umbral aproximado]
  const GIFTER_BADGE_TIERS = [
    { min: 4000, light: "#F2708A", dark: "#E9113C", accent: "#53FC18", shape: "sparkle" }, // rojo + moño verde (confirmado, umbral aproximado)
    { min: 3000, light: "#DEB2FF", dark: "#BC66FF", accent: "#1475E1", shape: "sparkle" }, // morado + moño azul (confirmado, umbral aproximado)
    { min: 2000, light: "#00CCB3", dark: "#00A18D", accent: "#F2708A", shape: "sparkle" }, // turquesa + moño rosa (confirmado, umbral aproximado)
    { min: 1000, light: "#53FC18", dark: "#32970E", accent: "#BC66FF", shape: "sparkle" }, // verde + moño morado
    { min: 950, light: "#FFC466", dark: "#FF9D00", accent: "#00AD93", shape: "bow" },      // dorado + moño teal (confirmado)
    { min: 900, light: "#F2708A", dark: "#E9113C", accent: "#31D6C2", shape: "bow" },      // rojo + moño turquesa (confirmado)
    { min: 700, light: "#FBCFD8", dark: "#F2708A", shape: "box-tall" }, // rosa (confirmado)
    { min: 500, light: "#DDFED1", dark: "#53FC18", shape: "box-tall" }, // verde
    { min: 400, light: "#53FC18", dark: "#BC66FF", shape: "box" },    // verde + listón morado (confirmado)
    { min: 300, light: "#FBCFD8", dark: "#F2708A", shape: "box" },    // rosa (confirmado)
    { min: 250, light: "#DEB2FF", dark: "#BC66FF", shape: "box" },    // morado (confirmado)
    { min: 200, light: "#B9D6F6", dark: "#72ACED", shape: "box" },    // azul (confirmado)
    { min: 150, light: "#93EBE0", dark: "#00CCB3", shape: "box" },    // turquesa (confirmado)
    { min: 100, light: "#DDFED1", dark: "#53FC18", shape: "box" },    // verde (confirmado)
    { min: 50,  light: "#FFD899", dark: "#FF9D00", shape: "crown" },  // dorado
    { min: 25,  light: "#FBCFD8", dark: "#E96E87", shape: "crown" },  // rosa
    { min: 10,  light: "#DEB2FF", dark: "#B664F6", shape: "crown" },  // morado
    { min: 5,   light: "#2EFAD1", dark: "#00A18D", shape: "crown" },  // turquesa
    { min: 1,   light: "#53FC18", dark: "#32970E", shape: "crown" },  // verde
  ];

  function getGifterBadgeColors(giftCount) {
    for (const tier of GIFTER_BADGE_TIERS) {
      if (giftCount >= tier.min) return tier;
    }
    return GIFTER_BADGE_TIERS[GIFTER_BADGE_TIERS.length - 1];
  }

  function getGifterBadgeSVG(giftCount) {
    const { light, dark, shape, accent } = getGifterBadgeColors(giftCount);

    if (shape === "bow") {
      // Forma "moño sin brillos" (tier 900) — SVG real de Kick.
      const ribbon = accent || dark;
      const uid = Math.random().toString(36).slice(2, 9);
      return `<svg width="18px" height="18px" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_bow_${uid})"><path d="M0 6H32V12H0V6Z" fill="${light}"></path><path d="M2 16H30V32H2V16Z" fill="${light}"></path><path d="M30 12H2V16H30V12Z" fill="${dark}"></path><path d="M14 6L16 3L14 0H6L10 6H12H14Z" fill="${light}"></path><path d="M22 6H20V32H12V6H14L18 0H26L22 6Z" fill="${ribbon}"></path></g><defs><clipPath id="clip0_bow_${uid}"><rect width="32" height="32" fill="white"></rect></clipPath></defs></svg>`;
    }

    if (shape === "sparkle") {
      // Forma "moño + brillos" (tiers 1000+) — SVG real de Kick. El color del
      // moño (accent) varía por tier.
      const ribbon = accent || "#BC66FF";
      const uid = Math.random().toString(36).slice(2, 9);
      return `<svg width="18px" height="18px" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_sparkle_${uid})"><path d="M0.02 6H32.02V14H0.02V6Z" fill="${light}"></path><path d="M0.02 18H32.02V32H0.02V18Z" fill="${light}"></path><path d="M30.02 14H2.02V18H30.02V14Z" fill="${dark}"></path><path d="M22.02 6H20.02V32H12.02V6H14.02L18.02 0H26.02L22.02 6Z" fill="${ribbon}"></path><path d="M14.02 6L16.02 3L14.02 0H6.02L10.02 6H12.02H14.02Z" fill="white"></path><path d="M3.02 9L2.14 7.16C2.14 6.98 1.84 6.88 1.84 6.88L0 6L1.84 5.12L2.14 4.82L3.02 2.98L3.9 4.82C3.9 4.92 4 5.02 4.2 5.12L6.04 5.9L4.2 6.78C4 6.86 3.9 6.96 3.9 7.16L3.02 9Z" fill="white"></path><path d="M30.02 16L29.44 14.78C29.44 14.64 29.24 14.58 29.24 14.58L28.02 14L29.24 13.42L29.44 13.22L30.02 12L30.6 13.22C30.6 13.22 30.68 13.36 30.8 13.42L32.02 13.94L30.8 14.52C30.66 14.58 30.6 14.66 30.6 14.78L30.02 16Z" fill="white"></path></g><defs><clipPath id="clip0_sparkle_${uid}"><rect width="32" height="32" fill="white"></rect></clipPath></defs></svg>`;
    }

    if (shape === "box-tall") {
      // Forma "caja alta con listón vertical" (tier 500) — SVG real de Kick.
      return `<svg width="18px" height="18px" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M30 18H2V32H30V18Z" fill="${light}"></path><path d="M30 8H2V14H30V8Z" fill="${light}"></path><path d="M10 8H12.5V14H4V18H12.5V32H19.5V18H28V14H19.5V8H22L26 2H18L16 5L14 2H6L10 8Z" fill="${dark}"></path></svg>`;
    }

    if (shape === "box") {
      // Forma "caja con listón vertical" (tiers 100, 200) — SVG real de Kick.
      return `<svg width="18px" height="18px" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M30 10H2V28H30V10Z" fill="${light}"></path><path d="M12 10H10L6 4H14L16 7L18 4H26L22 10H20V28H12V10Z" fill="${dark}"></path></svg>`;
    }

    // Forma "corona" (tiers 1, 5, 10, 25, 50) — SVG real de Kick.
    const uid = Math.random().toString(36).slice(2, 9); // evita choque de ids de clipPath si hay varios en el DOM
    return `<svg width="18px" height="18px" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_${uid})"><g clip-path="url(#clip1_${uid})"><path d="M22.34 9.5L26 4H18L16 7L14 4H6L9.66 9.5H4V15.1H28V9.5H22.34Z" fill="${light}"></path><path d="M26.0799 19.0996H5.8999V28.4996H26.0799V19.0996Z" fill="${light}"></path><path d="M26.0799 15.0996H5.8999V19.0996H26.0799V15.0996Z" fill="${dark}"></path></g></g><defs><clipPath id="clip0_${uid}"><rect width="24" height="24.5" fill="white" transform="translate(4 4)"></rect></clipPath><clipPath id="clip1_${uid}"><rect width="24" height="24.5" fill="white" transform="translate(4 4)"></rect></clipPath></defs></svg>`;
  }

  const KICK_USERNAME_COLORS = [
    "#00ff66", "#53fc18", "#00c7ff", "#0095ff", "#1da1f2", "#00aeef",
    "#2f80ed", "#5865f2", "#8b5cf6", "#a855f7", "#d946ef", "#ff4ecd",
    "#ff5c8a", "#ff3864", "#e9113c", "#ff6a4a", "#ff9500", "#ffc900",
    "#facc15", "#22c55e", "#14b8a6", "#06b6d4"
  ];

  const ENABLE_7TV_NAME_PAINTS = new URLSearchParams(window.location.search).get("paints") !== "off";

  const KICK_USERNAME_COLOR_NAMES = {
    green: "#00ff66",
    kick: "#53fc18",
    lime: "#53fc18",
    cyan: "#00c7ff",
    aqua: "#00c7ff",
    sky: "#00aeef",
    blue: "#0095ff",
    royal: "#2f80ed",
    indigo: "#5865f2",
    purple: "#8b5cf6",
    violet: "#a855f7",
    magenta: "#d946ef",
    pink: "#ff4ecd",
    rose: "#ff5c8a",
    red: "#e9113c",
    coral: "#ff6a4a",
    orange: "#ff9500",
    gold: "#ffc900",
    yellow: "#facc15",
    teal: "#14b8a6"
  };

  // ============ FETCH HELPERS ============
  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return params.get("channel");
  }

  function generateLink(channelName) {
    const baseUrl = window.location.href.split("?")[0];
    return `${baseUrl}?channel=${encodeURIComponent(channelName)}`;
  }

  async function fetchDirect(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      throw err;
    }
  }

  async function fetchWithProxy(url, timeout = 5000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    try {
      const proxyUrl = CORS_PROXY + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeoutId);
      return await res.json();
    } catch (err) {
      clearTimeout(timeoutId);
      try {
        const fallbackUrl = CORS_PROXY_FALLBACK + encodeURIComponent(url);
        const res2 = await fetch(fallbackUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeoutId);
        return await res2.json();
      } catch (err2) {
        clearTimeout(timeoutId);
        throw err2;
      }
    }
  }

  async function raceFetch(url) {
    return Promise.race([fetchDirect(url).catch(() => null), fetchWithProxy(url).catch(() => null)]).then(r => r || fetchWithProxy(url));
  }

  const smartFetch = raceFetch;

  // ============ CARGAR BADGES DE SUSCRIPTOR ============
  // Kick devuelve este badge genérico cuando el canal NO tiene sub-badges propios.
  // Lo tratamos como "no personalizado" para poder usar nuestro default local.
  const KICK_GENERIC_SUB_BADGE_ID = "754874";

  function isGenericKickSubBadge(url) {
    return typeof url === "string" && url.includes(KICK_GENERIC_SUB_BADGE_ID);
  }

  async function loadChannelSubBadges(channelSlug) {
    try {
      const data = await smartFetch(`https://kick.com/api/v2/channels/${channelSlug}/info`);

      subBadgesByMonths = {};

      if (data?.subscriber_badges && Array.isArray(data.subscriber_badges)) {
        data.subscriber_badges.forEach(badge => {
          const monthsKey = String(badge.months || badge.level || 1);
          let badgeUrl = badge.badge_image?.src
                      || badge.badge_image?.original
                      || badge.image_url
                      || badge.url;

          if (badgeUrl) {
            if (!badgeUrl.startsWith('http')) badgeUrl = `https:${badgeUrl}`;
            if (!isGenericKickSubBadge(badgeUrl)) {
              subBadgesByMonths[monthsKey] = badgeUrl;
            }
          }
        });
      }

      // Fallback v1 si v2 falla
      if (Object.keys(subBadgesByMonths).length === 0) {
        const fallbackData = await smartFetch(`https://kick.com/api/v1/channels/${channelSlug}`);
        if (fallbackData?.subscriber_badges) {
          fallbackData.subscriber_badges.forEach(tier => {
            const monthsKey = String(tier.months || tier.level || 1);
            let badgeUrl = tier.image_url || tier.badge?.src || tier.badge_image?.src || tier.url;
            if (monthsKey && badgeUrl) {
              badgeUrl = badgeUrl.startsWith('http') ? badgeUrl : `https:${badgeUrl}`;
              if (!isGenericKickSubBadge(badgeUrl)) {
                subBadgesByMonths[monthsKey] = badgeUrl;
              }
            }
          });
        }
      }

      if (Object.keys(subBadgesByMonths).length > 0) {

    return String(value ?? "").replace(/[&<>"']/g, ch => ({

  function to7TVColor(value, fallback = null) {
    if (value === undefined || value === null) return fallback;
    if (Array.isArray(value) && value.length >= 3) {
      const [r, g, b, rawAlpha = 1] = value.map(Number);
      if ([r, g, b].every(Number.isFinite)) {
        const alpha = Number.isFinite(rawAlpha) ? (rawAlpha > 1 ? rawAlpha / 255 : rawAlpha) : 1;
        const normalizedAlpha = Math.max(0, Math.min(1, alpha));
        return normalizedAlpha >= 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${normalizedAlpha})`;
      }
    }
    if (typeof value === "object") {
      const r = Number(value.r ?? value.red);
      const g = Number(value.g ?? value.green);
      const b = Number(value.b ?? value.blue);
      if ([r, g, b].every(Number.isFinite)) {
        const rawAlpha = Number(value.a ?? value.alpha ?? 1);
        const alpha = Number.isFinite(rawAlpha) ? (rawAlpha > 1 ? rawAlpha / 255 : rawAlpha) : 1;
        const normalizedAlpha = Math.max(0, Math.min(1, alpha));
        return normalizedAlpha >= 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${normalizedAlpha})`;
      }
      if (value.hex) return to7TVColor(value.hex, fallback);
      if (value.color) return to7TVColor(value.color, fallback);
      if (value.value) return to7TVColor(value.value, fallback);
    }
    if (typeof value === "number") return sevenTVIntToRGBA(value);
    if (typeof value === "string") {
      const trimmed = value.trim();
      if (!trimmed || trimmed === "none") return fallback;
      if (trimmed === "transparent" || trimmed === "currentColor" || trimmed.startsWith("var(")) return trimmed;
      const hex = trimmed.startsWith("#") ? trimmed.slice(1) : trimmed;
      if (/^[0-9a-f]{8}$/i.test(hex)) {
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        const a = parseInt(hex.slice(6, 8), 16) / 255;
        return `rgba(${r}, ${g}, ${b}, ${a})`;
      }
      if (/^#[0-9a-f]{3,6}$/i.test(trimmed)) return trimmed;
      if (/^[0-9a-f]{6}$/i.test(trimmed)) return `#${trimmed}`;
      if (/^\d+$/.test(trimmed)) return to7TVColor(Number(trimmed), fallback);
      if (/^-?\d+$/.test(trimmed)) return to7TVColor(Number(trimmed), fallback);
      if (/^(rgb|hsl)a?\(/i.test(trimmed)) return trimmed;
      if (/^[a-z]+$/i.test(trimmed)) return trimmed;
    }
    return fallback;
  }

  function get7TVAssetUrl(asset) {
    if (asset?.images?.length) {
      return normalize7TVUrl(
        asset.images.find(img => img.mime === "image/webp" && img.scale >= 2)?.url
        || asset.images.find(img => img.mime === "image/webp")?.url
        || asset.images.find(img => img.scale >= 2)?.url
        || asset.images[0]?.url
      );
    }

    const directUrl = asset?.url || asset?.image_url || asset?.icon_url;
    if (directUrl) return normalize7TVUrl(directUrl);

    const host = asset?.host || asset?.data?.host;
    const files = host?.files || [];
    const file = files.find(f => f.format === "WEBP" && /(?:2x|3x|4x)/i.test(f.name))
              || files.find(f => f.format === "WEBP")
              || files[0];

    if (host?.url && file?.name) return normalize7TVUrl(`${host.url}/${file.name}`);
    return "";

  async function fetch7TVGraphQL(query, variables) {
    const endpoints = location.protocol.startsWith("http")
      ? ["/api/7tv/gql", "https://7tv.io/v4/gql"]
      : ["https://7tv.io/v4/gql"];

    let lastError = null;

    for (const endpoint of endpoints) {
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ query, variables }),
          cache: "no-store"
        });

        if (!res.ok) throw new Error(`7TV GraphQL ${res.status}`);
        const json = await res.json();
        if (json.errors?.length) throw new Error(json.errors[0].message || "7TV GraphQL error");
        return json.data;
      } catch (err) {
        lastError = err;
      }
    }

    throw lastError || new Error("7TV GraphQL error");
  }

    const r = (n >>> 24) & 255;
    const g = (n >>> 16) & 255;
    const b = (n >>> 8) & 255;
    const a = (n & 255) / 255;
    return `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;

  function normalize7TVEventPaint(id, object) {
    const data = object?.data || object || {};
    const func = data.function || data.func;
    const stops = (data.stops || []).map(stop => ({
      ...stop,
      color: typeof stop.color === "number" ? sevenTVIntToRGBA(stop.color) : stop.color
    }));
    const shadows = (data.shadows || []).map(shadow => ({
      ...shadow,
      color: typeof shadow.color === "number" ? sevenTVIntToRGBA(shadow.color) : shadow.color
    }));

    return {
      id,
      name: object?.name || data.name || id,
      color: typeof data.color === "number" ? sevenTVIntToRGBA(data.color) : data.color,
      gradients: func ? [{
        function: func,
        angle: data.angle,
        repeat: data.repeat,
        stops,
        image_url: data.image_url,
        shape: data.shape
      }] : [],
      shadows
    };
  }

  function normalize7TVEventBadge(id, object) {
    return {
      id,
      name: object?.name || id,
      images: object?.images || [],
      url: `https://cdn.7tv.app/badge/${id}/3x`
    };
  }

  function get7TVEventKickConnectionIds(user) {
    return (user?.connections || [])
      .filter(connection => connection?.platform === "KICK")
      .flatMap(connection => [
        connection.id,
        connection.platformId,
        connection.platform_id,
        connection.platformUserId,
        connection.platform_user_id
      ])
      .filter(Boolean)
      .map(String);
  }

  function upsert7TVEntitlement(kickUserIds, kind, refId) {
    kickUserIds.forEach(userId => {
      const current = seventvChannelCosmetics.entitlements[userId] || {};
      seventvChannelCosmetics.entitlements[userId] = {
        ...current,
        [kind === "BADGE" ? "badge" : "paint"]: refId
      };
      delete seventvUserCache[`${userId}:`];
    });
  }

  function delete7TVEntitlement(kickUserIds, kind, refId) {
    kickUserIds.forEach(userId => {
      const current = seventvChannelCosmetics.entitlements[userId];
      if (!current) return;
      const key = kind === "BADGE" ? "badge" : "paint";
      if (current[key] === refId) {
        seventvChannelCosmetics.entitlements[userId] = { ...current, [key]: undefined };
      }
      delete seventvUserCache[`${userId}:`];
    });
  }

  function handle7TVCosmeticsEvent(eventData) {
    const type = eventData?.type;
    const object = eventData?.body?.object;
    const kind = object?.kind;
    const id = eventData?.body?.id || object?.id || object?.ref_id;
    const refId = object?.ref_id || id;

    if (type === "cosmetic.create" && kind === "BADGE" && id) {
      seventvChannelCosmetics.badges[id] = normalize7TVEventBadge(id, object);
      return;
    }

    if (type === "cosmetic.create" && kind === "PAINT" && id) {
      seventvChannelCosmetics.paints[id] = normalize7TVEventPaint(id, object);
      return;
    }

    if ((type === "entitlement.create" || type === "entitlement.delete") && (kind === "BADGE" || kind === "PAINT")) {
      const kickUserIds = get7TVEventKickConnectionIds(object?.user);
      if (!kickUserIds.length || !refId) return;
      if (type === "entitlement.create") {
        upsert7TVEntitlement(kickUserIds, kind, refId);
      } else {
        delete7TVEntitlement(kickUserIds, kind, refId);
      }
    }
  }

  function reset7TVChannelCosmetics() {
    if (sevenTVEventSource) {
      sevenTVEventSource.close();
      sevenTVEventSource = null;
    }
    seventvChannelCosmetics = {
      badges: {},
      paints: {},
      entitlements: {}
    };
  }

  function connect7TVCosmeticsEvents(kickUserId, emoteSetId = null) {
    reset7TVChannelCosmetics();
    if (!kickUserId || !window.EventSource) return;

    const channelContext = `<ctx=channel;platform=KICK;id=${kickUserId}>`;
    const topics = [
      `entitlement.*${channelContext}`,
      `cosmetic.*${channelContext}`
    ];
    if (emoteSetId) topics.push(`emote_set.*<object_id=${emoteSetId}>`);

    const url = `https://events.7tv.io/v3@${topics.join(",")}`;
    sevenTVEventSource = new EventSource(url);
    sevenTVEventSource.addEventListener("dispatch", event => {
      try {
        handle7TVCosmeticsEvent(JSON.parse(event.data));
      } catch (err) {
        console.warn("7TV cosmetics event failed:", err);
      }
    });
    sevenTVEventSource.addEventListener("error", err => {
      console.warn("7TV cosmetics stream error:", err);
    });
  }

  function get7TVCosmeticsFromEntitlements(kickUserId) {
    const entitlement = seventvChannelCosmetics.entitlements[String(kickUserId || "")];
    if (!entitlement) return null;

    const paint = entitlement.paint ? seventvChannelCosmetics.paints[entitlement.paint] : null;
    const badge = entitlement.badge ? seventvChannelCosmetics.badges[entitlement.badge] : null;
    if (!paint && !badge) return null;

    return {
      paint: paint || null,
      badges: badge ? [badge] : []
    };
  }

  const SEVENTV_USER_STYLE_QUERY = `
    query($platformId: String!, $username: String!) {
      byConnection: users {
        userByConnection(platform: KICK, platformId: $platformId) {
          id
          mainConnection { platform platformId platformUsername }
          style {
            activePaint {
              id name
              data {
                layers {
                  id opacity
                  ty {
                    __typename
                    ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                    ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                    ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                    ... on PaintLayerTypeImage { images { url scale mime } }
                  }
                }
                shadows { color { hex r g b a } offsetX offsetY blur }
              }
            }
            activeBadge { id name images { url scale mime } }
          }
        }
      }
      bySearch: users {
        search(query: $username, page: 1, perPage: 5) {
          items {
            id
            mainConnection { platform platformId platformUsername }
            style {
              activePaint {
                id name
                data {
                  layers {
                    id opacity
                    ty {
                      __typename
                      ... on PaintLayerTypeSingleColor { color { hex r g b a } }
                      ... on PaintLayerTypeLinearGradient { angle repeating stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeRadialGradient { repeating shape stops { at color { hex r g b a } } }
                      ... on PaintLayerTypeImage { images { url scale mime } }
                    }
                  }
                  shadows { color { hex r g b a } offsetX offsetY blur }
                }
              }
              activeBadge { id name images { url scale mime } }
            }
          }
        }
      }
    }
  `;

  function normalize7TVGraphQLUser(data, kickUserId, username) {
    const exact = data?.byConnection?.userByConnection;
    const items = data?.bySearch?.search?.items || [];
    const normalizedUsername = username?.toLowerCase() || "";

    // Búsqueda de 7TV es "fuzzy" (por texto) y puede devolver cuentas de OTRA persona
    // con un nombre parecido (ej. "Lilbastt" -> "lil_nas_t"). Por eso solo aceptamos un
    // resultado de bySearch si es KICK y coincide exactamente el ID (si lo tenemos) y el
    // username (si lo tenemos). Nunca se acepta "cualquier resultado de Kick" ni "el primer
    // resultado" como fallback genérico: eso es lo que causaba que se le pusiera pintura/badge
    // de otra persona a alguien que no la tiene.
    const searched = items.find(item => {
      const connection = item.mainConnection || {};
      if (connection.platform !== "KICK") return false;
      if (kickUserId && connection.platformId !== String(kickUserId)) return false;
      if (normalizedUsername && connection.platformUsername?.toLowerCase() !== normalizedUsername) return false;
      return true;
    }) || null;

    // "exact" viene de una consulta directa por platformId (ID exacto de Kick) y es la
    // fuente más confiable. Solo usamos "searched" si "exact" no existe.
    const user = exact || searched;
    if (!user) return null;

    return {
      paint: user.style?.activePaint || null,
      badges: user.style?.activeBadge ? [user.style.activeBadge] : []
    };
  }

  async function fetch7TVUserCosmetics(kickUserId, username = "") {
    const normalizedUsername = username?.toLowerCase() || "";
    const cacheKey = `${kickUserId || ""}:${normalizedUsername}`;
    const entitlementCosmetics = get7TVCosmeticsFromEntitlements(kickUserId);

    const cached = seventvUserCache[cacheKey];
    if (cached && Date.now() - cached.time < SEVENTV_USER_CACHE_TTL) {
      return merge7TVCosmetics(entitlementCosmetics, cached.value);
    }
    if (!kickUserId && !normalizedUsername) return entitlementCosmetics || null;

    if (username) {
      try {
        const data = await fetch7TVGraphQL(SEVENTV_USER_STYLE_QUERY, {
          platformId: String(kickUserId || ""),
          username
        });
        const cosmetics = normalize7TVGraphQLUser(data, kickUserId, username);
        if (cosmetics?.paint || cosmetics?.badges?.length) {
          cosmetics.paint = await enrich7TVPaintFromGlobal(cosmetics.paint);
          const merged = merge7TVCosmetics(entitlementCosmetics, cosmetics);
          seventvUserCache[cacheKey] = { value: merged, time: Date.now() };
          return merged;
        }
      } catch (err) {
        console.warn("7TV v4 fallback failed:", username, err);
      }
    }

    try {
      const data = await smartFetch(`https://7tv.io/v3/users/kick/${kickUserId}`);
      if (!data?.user) {
        throw new Error("7TV v3 user not found");
      }
      const cosmetics = {
        paint: pickActive7TVPaint(data.user),
        badges: pickActive7TVBadges(data.user)
      };
      cosmetics.paint = await enrich7TVPaintFromGlobal(cosmetics.paint);
      const merged = merge7TVCosmetics(entitlementCosmetics, cosmetics);
      seventvUserCache[cacheKey] = { value: merged, time: Date.now() };
      return merged;
    } catch {
      seventvUserCache[cacheKey] = { value: entitlementCosmetics || null, time: Date.now() };
      return entitlementCosmetics || null;
    }
  }

  function processEmotes(text) {
    if (!text) return "";
    let result = text;

    // Kick native emotes
    result = result.replace(/\[emote:(\d+):([^\]]+)\]/g, (_, id) => 
      `<img src="https://files.kick.com/emotes/${id}/fullsize" class="emote">`
    );

    // 7TV community → global → bttv → ffz (orden de prioridad inverso al largo)
    [
      ...Object.entries(emotesData.seventv.community),
      ...Object.entries(emotesData.seventv.global),
      ...Object.entries(emotesData.bttv.global),
      ...Object.entries(emotesData.ffz.global)
    ]
    .sort((a,b) => b[0].length - a[0].length)
    .forEach(([code, emote]) => {
      const escaped = code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      result = result.replace(
        new RegExp(`(?<!<[^>]*>)\\b${escaped}\\b(?![^<]*>)`, 'g'),
        `<img src="${emote.url}" srcset="${emote.url} 1x, ${emote.url2x || emote.url} 2x" class="emote-third" alt="${code}" title="${code}">`
      );
    });

    return result;
  }

  function build7TVShadowStyles(shadowsData) {
    const shadows = (shadowsData || [])
      .map(s => {
        const color = to7TVColor(s.color, "rgba(0,0,0,.85)");
        const x = s.x_offset ?? s.offsetX ?? 0;
        const y = s.y_offset ?? s.offsetY ?? 0;
        const blur = s.radius ?? s.blur ?? 0;
        return { x, y, blur, color };
      });

    if (!shadows.length) return "";

    const textShadow = shadows
      .map(s => `${s.x}px ${s.y}px ${s.blur}px ${s.color}`)
      .join(", ");
    const filterShadow = shadows
      .map(s => `drop-shadow(${s.x}px ${s.y}px ${s.blur}px ${s.color})`)
      .join(" ");

    return ` text-shadow: ${textShadow}; filter: ${filterShadow};`;
  }

  function build7TVTextShadowStyle(shadowsData) {
    const textShadow = (shadowsData || [])
      .map(s => {
        const color = to7TVColor(s.color, "rgba(0,0,0,.85)");
        const x = s.x_offset ?? s.offsetX ?? 0;
        const y = s.y_offset ?? s.offsetY ?? 0;
        const blur = s.radius ?? s.blur ?? 0;
        return `${x}px ${y}px ${blur}px ${color}`;
      })
      .filter(Boolean)
      .join(", ");

    return textShadow ? ` text-shadow: ${textShadow};` : "";
  }

  function build7TVPaintBackgroundLayers(paint, base) {
    const backgroundLayers = [];
    const solidColors = [];
    const layerOpacities = [];

    get7TVPaintLayers(paint).forEach(layer => {
      const ty = layer.ty || layer.type || layer.image || layer;
      const gradient = layer.gradient || layer.linearGradient || layer.radialGradient || layer.background || ty;
      const typeName = String(ty.__typename || ty.type || ty.kind || gradient.type || gradient.function || "").toUpperCase();
      const rawOpacity = Number(layer.opacity ?? ty.opacity ?? gradient.opacity);
      if (Number.isFinite(rawOpacity)) layerOpacities.push(Math.max(0, Math.min(1, rawOpacity > 1 ? rawOpacity / 100 : rawOpacity)));

      if ((typeName.includes("SINGLECOLOR") || typeName === "COLOR" || typeName.includes("SOLID")) && (ty.color || layer.color)) {
        solidColors.push(to7TVColor(ty.color || layer.color, base));
        return;
      }

      if ((typeName.includes("LINEARGRADIENT") || typeName.includes("RADIALGRADIENT")) && ty.stops?.length) {
        const stops = ty.stops
          .map(s => `${to7TVColor(s.color, base)} ${Math.max(0, Math.min(1, Number(s.at || 0))) * 100}%`)
          .join(", ");
        backgroundLayers.push(
          typeName.includes("RADIAL")
            ? `radial-gradient(circle, ${stops})`
            : `linear-gradient(${ty.angle || 90}deg, ${stops})`
        );
        return;
      }

      const imageUrl = get7TVPaintImageUrl(ty) || get7TVPaintImageUrl(layer);
      if (imageUrl) {
        backgroundLayers.push(`url("${imageUrl.replace(/"/g, "%22")}")`);
        return;
      }

      const gradientFunction = String(gradient.function || "").toUpperCase();
      const gradientImageUrl = normalize7TVUrl(gradient.image_url || gradient.imageUrl || "");
      if (gradientImageUrl && (gradientFunction.includes("URL") || !gradient.stops?.length)) {
        backgroundLayers.push(`url("${gradientImageUrl.replace(/"/g, "%22")}")`);
        return;
      }

      const stops = (gradient.stops || [])
        .map(s => {
          const color = to7TVColor(s.color, base);
          const rawAt = Number(s.at ?? 0);
          const at = Math.max(0, Math.min(1, rawAt > 1 ? rawAt / 100 : rawAt));
          return `${color} ${at * 100}%`;
        })
        .join(", ");

      if (stops) {
        backgroundLayers.push(
          gradientFunction.includes("RADIAL")
            ? `radial-gradient(${gradient.shape || "circle"}, ${stops})`
            : `linear-gradient(${gradient.angle || 90}deg, ${stops})`
        );
      }
    });

    return {
      backgroundLayers,
      solidColor: solidColors.find(Boolean) || to7TVColor(paint?.color, null),
      opacity: layerOpacities.find(value => value < 1) ?? null
    };
  }

  function ensure7TVPaintClass(paint, base) {
    if (!paint?.id) return "";

    const className = get7TVPaintClassName(paint.id);
    if (injected7TVPaintClasses.has(className)) {
      return { className, hasDirect: !!injected7TVPaintOverlays[className] };
    }

    const { backgroundLayers, solidColor } = build7TVPaintBackgroundLayers(paint, base);

    const shadowsData = [
      ...(paint.shadows || []),
      ...(paint.text?.shadows || []),
      ...(!paint.shadows?.length && !paint.text?.shadows?.length ? (paint.data?.shadows || []) : [])
    ];

    // Construir filter drop-shadow igual que 7database
    const filterParts = shadowsData.map(s => {
      const color = to7TVColor(s.color, "rgba(0,0,0,0.85)");
      const x = s.x_offset ?? s.offsetX ?? 0;
      const y = s.y_offset ?? s.offsetY ?? 0;
      const blur = s.radius ?? s.blur ?? 0;
      return `drop-shadow(${color} ${x}px ${y}px ${blur}px)`;
    });
    const filterStyle = filterParts.length ? `filter: ${filterParts.join(" ")};` : "";

    let declarations;

    if (backgroundLayers.length > 0) {
      // Detectar si es un paint de imagen animada (AVIF sprite sheet)
      const layers = get7TVPaintLayers(paint);
      const imageLayer = layers.find(l => {
        const ty = l.ty || l.type || l;
        return String(ty.__typename || "").includes("Image");
      });
      const imageTy = imageLayer?.ty || imageLayer?.type || imageLayer;
      const animImages = (imageTy?.images || []).filter(img => img.frameCount > 1);
      const isAnimatedSprite = animImages.length > 0;

      let animDecl = "";
      if (isAnimatedSprite) {
        // El AVIF de 7TV es un sprite sheet vertical: N frames apilados verticalmente
        // background-size: 100% * N, luego se anima con steps(N)
        const frameCount = animImages[0].frameCount;
        const keyframeName = `${className}-anim`;
        const keyframes = `@keyframes ${keyframeName} { from { background-position: 0% 0%; } to { background-position: 0% 100%; } }`;
        get7TVPaintStyleSheet().appendChild(document.createTextNode(keyframes + "\n"));
        animDecl = `background-size: 100% ${frameCount * 100}%; animation: ${keyframeName} ${frameCount * 0.05}s steps(${frameCount}) infinite;`;
      }

      // Gradiente o imagen: background-clip: text directo (metodo 7database)
      declarations = [
        `background-image: ${backgroundLayers.join(", ")};`,
        isAnimatedSprite ? "" : `background-size: cover;`,
        isAnimatedSprite ? "" : `background-position: center center;`,
        animDecl,
        `-webkit-background-clip: text;`,
        `background-clip: text;`,
        `-webkit-text-fill-color: transparent;`,
        `color: transparent;`,
        filterStyle
      ].filter(Boolean).join(" ");
    } else {
      // Solo color solido
      const color = solidColor || "var(--kick-name-color)";
      declarations = `color: ${color}; -webkit-text-fill-color: ${color}; ${filterStyle}`;
    }

    get7TVPaintStyleSheet().appendChild(document.createTextNode(`.${className}{${declarations}}\n`));
    injected7TVPaintClasses.add(className);
    injected7TVPaintOverlays[className] = backgroundLayers.length > 0;
    return { className, hasDirect: backgroundLayers.length > 0 };
  }

  function generateNamePaint(m, cosmetics) {
    const colorInfo = getKickUsernameColorInfo(m);
    const base = colorInfo.color;
    const style = `--kick-name-color: ${base}; color: ${base};`;

    return {
      style,
      className: paintClass?.className || "",
      hasDirect: !!paintClass?.hasDirect
    };
  }

  async function getChannelId(channelSlug) {
    statusMsg.textContent = "Obteniendo canal...";
    statusMsg.style.color = "#53fc18";
    try {
      // Intentamos v2 primero (tiene user_id que necesitamos para 7TV)
      let data = null;
      try {
        data = await smartFetch(`https://kick.com/api/v2/channels/${channelSlug}`);
      } catch {}

      // Fallback a v1 si v2 falla
      if (!data?.id) {
        data = await smartFetch(`https://kick.com/api/v1/channels/${channelSlug}`);
      }

      const userId = data.user_id || data.user?.id || null;

      return {
        channelId: data.id,
        chatroomId: data.chatroom?.id,
        isLive: !!data.livestream?.id,
        userId
      };
    } catch (err) {
      statusMsg.textContent = "Error: " + err.message;
      statusMsg.style.color = "#ff4444";
      throw err;
    }
  }

  async function loadChat() {
    const channelName = channelInput.value.trim().toLowerCase();
    if (!channelName) {
      statusMsg.textContent = "Ingresa un nombre de canal";
      statusMsg.style.color = "#ff4444";
      return;
    }

    try {
      const result = await getChannelId(channelName);
      CHANNEL_ID = result.channelId;
      CHATROOM_ID = result.chatroomId;
      STREAMER_USER_ID = result.userId || result.channelId; // fallback al channelId si no hay userId
      currentChannel = channelName;
      CHAT_URL = `https://kick.com/api/v2/channels/${CHANNEL_ID}/messages`;

      await loadChannelSubBadges(channelName);
      const thirdPartyData = await loadAllThirdPartyData();
      connect7TVCosmeticsEvents(STREAMER_USER_ID, thirdPartyData.emoteSetId);

      const isDirectLink = getUrlParams() !== null;
      if (isDirectLink) {
        inputContainer.style.display = "none";
        chatDiv.style.display = "flex";
      } else {
        statusMsg.textContent = result.isLive ? `🔴 EN VIVO: ${channelName}` : `⚫ OFFLINE: ${channelName}`;
        statusMsg.style.color = result.isLive ? "#53fc18" : "#ffaa00";
        generatedLink.value = generateLink(channelName);
        linkContainer.style.display = "block";
        channelInput.style.display = "none";
        loadBtn.style.display = "none";
        chatDiv.style.display = "flex";
      }

      chatDiv.innerHTML = "";
      messageIds.clear();

      connectWebSocket();
      fetchInitialMessages();
    } catch (err) {
      console.error(err);
    }
  }

  function connectWebSocket() {
    if (kickWS) kickWS.close();
    kickWS = new WebSocket(PUSHER_WS_URL);

    kickWS.addEventListener("open", () => {
      kickWS.send(JSON.stringify({
        event: "pusher:subscribe",
        data: { auth: "", channel: `chatrooms.${CHATROOM_ID}.v2` }
      }));
    });

    kickWS.addEventListener("message", (event) => {
      try {
        const parsed = JSON.parse(event.data);
        if (parsed.event === "App\\Events\\ChatMessageEvent") {
          const data = JSON.parse(parsed.data);
          addMessage({
            id: data.id,
            content: data.content,
            sender: data.sender,
            identity: data.sender.identity
          });
        }
      } catch {}
    });

    kickWS.addEventListener("error", () => setTimeout(connectWebSocket, 1500));
    kickWS.addEventListener("close", () => setTimeout(connectWebSocket, 1500));
  }

async function fetchInitialMessages() {
  if (!CHAT_URL) return;

  let url = CHAT_URL;
  let loaded = 0;
  const MAX_PAGES = 3;      // intenta hasta 3 páginas (ajusta según rate-limit)
  const MESSAGES_PER_PAGE = 100; // suposición

  for (let page = 0; page < MAX_PAGES; page++) {
    try {
      const data = await raceFetch(url);
      const msgs = data?.data?.messages || data?.messages || [];

      if (!msgs.length) break;

      msgs.reverse().forEach(m => {
        if (!messageIds.has(m.id)) {
          addMessage(m);
          loaded++;
        }
      });

      // Intento de paginación (cambia según lo que veas en Network tab)
      // Ejemplos probados por gente: ?before={last_id}  o  ?cursor={next_cursor}
      const lastMsg = msgs[msgs.length - 1];
      if (!lastMsg?.id) break;

      url = `${CHAT_URL}?before=${lastMsg.id}`;  // ← prueba este parámetro primero
      // Alternativas a probar si no funciona:
      // url = `${CHAT_URL}?cursor=${lastMsg.id}`;
      // url = `${CHAT_URL}?limit=100&before_id=${lastMsg.id}`;

      await new Promise(r => setTimeout(r, 800)); // delay anti-rate-limit
    } catch (e) {
      console.warn("Error en página de historial", page, e);
      break;
    }
  }

  console.log(`Cargados ${loaded} mensajes iniciales`);
  statusMsg.textContent += ` | ${loaded} mensajes históricos cargados`;
}

  // Eventos
  copyLinkBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(generatedLink.value);
    copyLinkBtn.textContent = "Copiado ✓";
    setTimeout(() => copyLinkBtn.textContent = "📋 Copiar", 1800);
  });

  openLinkBtn.addEventListener("click", () => window.open(generatedLink.value, "_blank"));

  loadBtn.addEventListener("click", loadChat);
  channelInput.addEventListener("keypress", e => {
    if (e.key === "Enter") loadChat();
  });

  window.addEventListener("DOMContentLoaded", () => {
    const param = getUrlParams();
    if (param) {
      channelInput.value = param;
      loadChat();
    }
  });

  // Font-size responsive al ancho real del contenedor (OBS, cualquier tamaño)
  (function initResponsiveFont() {
    const chatEl = document.getElementById("chat");
    function updateFontSize(width) {
      // 300px -> ~14px | 400px -> ~18px | 500px+ -> 22px max
      const size = Math.min(26, Math.max(14, Math.round(width * 0.068)));
      chatEl.style.fontSize = size + "px";
    }
    const ro = new ResizeObserver(entries => {
      for (const entry of entries) updateFontSize(entry.contentRect.width);
    });
    ro.observe(chatEl);
    updateFontSize(chatEl.getBoundingClientRect().width || window.innerWidth);
  })();
</script>
